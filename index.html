    // Pictures for quiz answers (drawn here so there are no image files).
    function diagramSVG(kind) {
      const solar = kind === "solar";
      const earthX = solar ? 156 : 110, moonX = solar ? 102 : 168;
      const shadow = solar
        ? `<polygon points="${moonX},37 ${earthX - 15},42 ${earthX - 15},48 ${moonX},53" fill="#120b2e" opacity="0.6"/><circle cx="${earthX - 13}" cy="45" r="4" fill="#120b2e" opacity="0.7"/>`
        : `<polygon points="${earthX},28 200,33 200,57 ${earthX},62" fill="#120b2e" opacity="0.6"/>`;
      return `<svg viewBox="0 0 200 90" aria-hidden="true">
        <rect width="200" height="90" rx="14" fill="#1e1650"/>
        <circle cx="20" cy="45" r="34" fill="#ffd23f" opacity="0.25"/>
        <circle cx="20" cy="45" r="24" fill="#ffd23f"/>
        <circle cx="${earthX}" cy="45" r="17" fill="#3a8dde"/>
        <path d="M${earthX - 9} ${38} q7 -5 12 1 q-2 8 -10 7 z M${earthX + 2} ${50} q6 -2 8 3 q-5 4 -9 1 z" fill="#3fb15a"/>
        ${shadow}
        <circle cx="${moonX}" cy="45" r="8" fill="${solar ? "#a7a3b3" : "#c0552f"}"/>
      </svg>`;
    }
    const QUIZ_PICTURES = {
      diagramSolar: () => diagramSVG("solar"),
      diagramLunar: () => diagramSVG("lunar"),
      eclipseGlasses: () => ICONS.glasses,
      sunglasses: () => `<svg viewBox="0 0 220 100" aria-hidden="true">
        <path d="M14 40 L2 26" stroke="#2b2b33" stroke-width="7" stroke-linecap="round"/>
        <path d="M206 40 L218 26" stroke="#2b2b33" stroke-width="7" stroke-linecap="round"/>
        <path d="M96 52 Q110 40 124 52" stroke="#2b2b33" stroke-width="7" fill="none" stroke-linecap="round"/>
        <rect x="10" y="32" width="88" height="54" rx="24" fill="#5a6488" stroke="#2b2b33" stroke-width="7"/>
        <rect x="122" y="32" width="88" height="54" rx="24" fill="#5a6488" stroke="#2b2b33" stroke-width="7"/>
        <ellipse cx="38" cy="48" rx="12" ry="6" fill="#fff" opacity="0.4"/>
        <ellipse cx="150" cy="48" rx="12" ry="6" fill="#fff" opacity="0.4"/></svg>`,
    };

    // One-line facts shown when the child taps a body in chapter 1.
    const BODY_FACTS = {
      sun: "☀️ A giant ball of hot, glowing gas",
      earth: "🌍 Our home planet. Earth spins once a day.",
      moon: "🌙 A ball of rock that travels around Earth",
    };
    const TASK_TEXT = {
      tapBodies: (n) => `👆 Tapped ${n} of 3`,
      orbitOnce: "🌙 Moon trip",
      almost: "Almost! Keep going! ✨",
      done: "You did it! 🎉",
      quizCount: (n, total) => `Question ${n} of ${total}`,
    };

    /* ---------- Short scripts for free exploration and the ground view ---------- */
    const SCRIPTS = {
      almost: "Almost! Keep going!",
      alignSolar: [
        { guide: "kai", text: "The Moon is in the middle! The Moon's shadow falls on Earth.",
          more: "A solar eclipse can only happen at new moon, when the Moon is between Earth and the Sun. The Moon's path is a little tilted, so most months the Moon's shadow misses Earth." },
      ],
      alignLunar: [
        { guide: "kai", text: "Earth is in the middle! The Moon is inside Earth's shadow.",
          more: "A lunar eclipse can only happen at full moon. The Moon's path is a little tilted, so most months the Moon passes just above or below Earth's shadow." },
      ],
      redMoon: [
        { guide: "stella", text: "Look! The Moon is turning red!",
          more: "The Moon doesn't go completely dark. A little sunlight still reaches the Moon." },
        { guide: "stella", text: "Earth's air bends some sunlight onto the Moon, like a sunset!",
          more: "Air scatters blue light away and lets red light through. That's why sunsets look red. During a lunar eclipse, light from all the sunsets around Earth shines on the Moon!" },
      ],
      solarSafety: [
        { guide: "kai", icon: "glasses", lockSeconds: 2,
          text: "Never look at the Sun without special eclipse glasses!",
          more: "This rule is for every solar eclipse, and for every normal day too." },
        { guide: "kai", text: "Sunlight can hurt your eyes, even when your eyes don't feel any pain.",
          more: "Even a thin sliver of the Sun is too bright. Your eyes can't feel that kind of damage happening, so you have to protect your eyes." },
        { guide: "kai", icon: "glasses", text: "Regular sunglasses are not enough. Eclipse glasses block almost all the sunlight!",
          more: "Eclipse glasses are thousands of times darker than sunglasses. Ask a grown-up to check that your glasses are made for looking at the Sun." },
        { guide: "kai", text: "Okay! Now let's watch the eclipse.",
          more: "In real life, keep your eclipse glasses on the whole time you look up at the Sun." },
      ],
      solarTotal: [
        { guide: "kai", text: "Wow! The sky got dark in the daytime, and the stars came out!",
          more: "The glowing ring is the corona, the Sun's super-hot outer air. Birds and animals often think evening has come and get ready for bed!" },
      ],
      freeStart: [
        { guide: "kai", text: "Free play! Move the Moon and make any eclipse you like.",
          more: "Try the 🔦 Shadows button, and tap See it from Earth! when the Moon clicks into place." },
      ],
      freeSolar: [
        { guide: "kai", text: "Solar eclipse! The Moon is in the middle.",
          more: "The Moon's shadow falls on Earth. People inside that shadow see the Sun get covered." },
      ],
      freeLunar: [
        { guide: "kai", text: "Lunar eclipse! Earth is in the middle.",
          more: "Earth's shadow covers the Moon. Keep watching: the Moon will turn red!" },
      ],
      freeRed: [
        { guide: "stella", text: "The Moon turned red, like a sunset!",
          more: "Earth's air bends a little red sunlight onto the Moon. That's why the Moon glows red instead of going dark." },
      ],
      lunarSafe: [
        { guide: "kai", text: "Watching a lunar eclipse is safe. You don't need glasses!",
          more: "A lunar eclipse happens at night and can last more than an hour. Binoculars make the red Moon look even cooler!" },
      ],
    };


    /* ---------- Lesson engine ---------- */
    const lesson = {
      active: false,
      chapter: 0,
      step: 0,
      completed: new Set(),
      stepKey: null,                 // which step the per-step memory below belongs to
      done: false,                   // has the child done this step's action?
      taps: new Set(),
      travel: 0,                     // how far the child pushed the Moon (radians)
      token: 0,                      // ignores answers from an older bubble
    };
    const reactions = { enabled: true }; // free-exploration reactions, off during lessons
    const freePlay = { active: false, unlocked: false };

    const progressEl = document.getElementById("progress");
    const dotsEl = document.getElementById("progress-dots");
    const titleEl = document.getElementById("progress-title");
    const chipEl = document.getElementById("task-chip");
    const labelsEl = document.getElementById("fact-labels");
    const quizEl = document.getElementById("quiz");
    const quizAnswersEl = document.getElementById("quiz-answers");
    const quizCountEl = document.getElementById("quiz-count");
    const freePlayBtn = document.getElementById("btn-free-play");
    freePlayBtn.addEventListener("click", () => startFreePlay());

    // --- Saved progress (works fine without storage, e.g. in a private window) ---
    const PROGRESS_KEY = "eclipse-explorer.progress";
    function saveProgress() {
      try {
        localStorage.setItem(PROGRESS_KEY, JSON.stringify({
          completed: [...lesson.completed].map((i) => LESSONS[i].id),
          current: lesson.active ? LESSONS[lesson.chapter].id : null,
          freePlay: freePlay.unlocked,
        }));
      } catch { /* storage blocked: progress just isn't remembered */ }
    }
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || null; } catch { return null; }
    }
    function resetProgress() {
      try { localStorage.removeItem(PROGRESS_KEY); } catch { /* fine */ }
      lesson.completed.clear();
      freePlay.unlocked = false;
      freePlay.active = false;
      startChapter(0);
    }

    // --- Quiz ---
    const quizSteps = (c) => c.steps.filter((st) => st.quiz);
    function hideQuiz() { quizEl.hidden = true; quizAnswersEl.replaceChildren(); }
    function renderQuiz(step) {
      const all = quizSteps(LESSONS[lesson.chapter]);
      quizCountEl.textContent = TASK_TEXT.quizCount(all.indexOf(step) + 1, all.length);
      quizAnswersEl.classList.toggle("solved", lesson.done);
      quizAnswersEl.replaceChildren(...step.quiz.answers.map((a) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "quiz-answer";
        if (a.picture) b.insertAdjacentHTML("beforeend", QUIZ_PICTURES[a.picture]());
        if (a.emoji) b.insertAdjacentHTML("beforeend", `<span class="big-emoji" aria-hidden="true">${a.emoji}</span>`);
        if (a.label) b.insertAdjacentHTML("beforeend", `<span>${a.label}</span>`);
        b.setAttribute("aria-label", a.alt || a.label);
        if (lesson.done && a.correct) b.classList.add("right");
        b.addEventListener("click", () => answerQuiz(step, a, b));
        return b;
      }));
      quizEl.hidden = false;
    }
    function answerQuiz(step, answer, button) {
      if (lesson.done || button.classList.contains("wrong")) return;
      if (answer.correct) {
        button.classList.add("right");
        quizAnswersEl.classList.add("solved");
        Sound.cheer();
        confetti();
        lesson.done = true;
        Guides.allowNext();
        Guides.cheer(step.quiz.praise, 0);
        emit("quizanswer", { id: step.id, correct: true });
      } else {
        button.classList.add("wrong");
        button.setAttribute("aria-disabled", "true");
        Sound.boop();
        Guides.cheer(step.quiz.hint, 0); // gentle hint, then another try
        emit("quizanswer", { id: step.id, correct: false });
      }
    }

    // --- Confetti (skipped with reduced motion) ---
    const confettiCanvas = document.getElementById("confetti");
    const confettiCtx = confettiCanvas.getContext("2d");
    let confettiBits = [], confettiRunning = false;
    function confetti() {
      if (CONFIG.reducedMotion) return;
      const w = (confettiCanvas.width = window.innerWidth), h = (confettiCanvas.height = window.innerHeight);
      const colors = ["#ffd23f", "#ff8fab", "#7bd389", "#7fc8ff", "#b9a7ff", "#ff9f43"];
      for (let i = 0; i < 140; i++) {
        confettiBits.push({
          x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: h * 0.35,
          vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 10,
          r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          s: 7 + Math.random() * 7, c: colors[i % colors.length], life: 0,
        });
      }
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
    }
    function confettiFrame() {
      const w = confettiCanvas.width, h = confettiCanvas.height;
      confettiCtx.clearRect(0, 0, w, h);
      confettiBits = confettiBits.filter((b) => b.y < h + 20 && b.life < 240);
      confettiBits.forEach((b) => {
        b.life++; b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        confettiCtx.save();
        confettiCtx.translate(b.x, b.y);
        confettiCtx.rotate(b.r);
        confettiCtx.fillStyle = b.c;
        confettiCtx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        confettiCtx.restore();
      });
      if (confettiBits.length) requestAnimationFrame(confettiFrame);
      else { confettiRunning = false; confettiCtx.clearRect(0, 0, w, h); }
    }

    const currentStep = () => LESSONS[lesson.chapter].steps[lesson.step];
    const freePlayIndex = () => LESSONS.findIndex((c) => c.freePlay);

    function applyEffects(effects) {
      [].concat(effects || []).forEach((fx) => {
        if (fx === "showShadowCones") setShadowCones(true);
        else if (fx === "hideShadowCones") setShadowCones(false);
        else if (fx === "showLightRays") setLightRays(true);
        else if (fx === "hideLightRays") setLightRays(false);
        else if (fx === "resetView") resetView();
        else if (fx === "moonStart") setRawAngle(Math.PI / 2); // behind Earth (top of the screen), 90° from both line-ups
      });
    }

    function isActionAlreadyDone(action) {
      if (action === "alignSolar") return state.aligned === "solar";
      if (action === "alignLunar") return state.aligned === "lunar";
      if (action === "redMoon") return state.redness > 0.9;
      return false;
    }

    function renderProgress() {
      dotsEl.replaceChildren(...LESSONS.map((c, i) => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chapter-dot";
        b.textContent = c.icon;
        const done = lesson.completed.has(i);
        const current = c.freePlay ? freePlay.active : lesson.active && i === lesson.chapter;
        b.classList.toggle("done", done);
        b.classList.toggle("current", current);
        // You can go back to any chapter you finished (or restart the one you're in).
        // Free play opens once the quiz is done.
        const locked = c.freePlay ? !freePlay.unlocked : !(done || current);
        b.disabled = locked;
        b.setAttribute("aria-label", `${c.freePlay ? "" : `Chapter ${i + 1}: `}${c.title}${locked ? " (locked)" : done ? " (done)" : ""}`);
        if (current) b.setAttribute("aria-current", "step");
        b.title = b.getAttribute("aria-label");
        b.addEventListener("click", () => startChapter(i));
        li.appendChild(b);
        return li;
      }));
      const c = LESSONS[lesson.chapter];
      titleEl.textContent = lesson.active ? `${lesson.chapter + 1} · ${c.title}`
        : freePlay.active ? "🎉 Free play" : "You finished the lessons! 🎉";
      progressEl.hidden = false;
      freePlayBtn.hidden = !(freePlay.unlocked && !freePlay.active);
    }

    function setChip(html, done = false) {
      chipEl.innerHTML = html;
      chipEl.hidden = !html;
      chipEl.classList.toggle("done", done);
    }

    // --- Fact labels that float above the bodies in chapter 1 ---
    const factLabels = new Map(); // body → element
    const labelAnchor = new THREE.Vector3();
    function showFact(body) {
      if (factLabels.has(body)) return;
      const el = document.createElement("div");
      el.className = "fact-label";
      el.textContent = BODY_FACTS[body];
      if (body === "moon") el.classList.add("below"); // keeps the Moon's label off Earth's
      labelsEl.appendChild(el);
      factLabels.set(body, el);
    }
    function clearFacts() { factLabels.forEach((el) => el.remove()); factLabels.clear(); }
    function updateFactLabels() {
      if (!factLabels.size) return;
      const w = window.innerWidth, h = window.innerHeight;
      factLabels.forEach((el, body) => {
        const below = el.classList.contains("below");
        if (body === "sun") labelAnchor.copy(sun.position).y += CONFIG.sun.radius + 1;
        else if (body === "earth") labelAnchor.copy(earthSystem.position).y += CONFIG.earth.radius + 0.8;
        else { moon.getWorldPosition(labelAnchor); labelAnchor.y -= CONFIG.moon.radius + 0.5; }
        labelAnchor.project(camera);
        const x = (labelAnchor.x * 0.5 + 0.5) * w, y = (-labelAnchor.y * 0.5 + 0.5) * h;
        // Keep the label on screen; the little tail still points at the body.
        const half = el.offsetWidth / 2, margin = 12;
        const cx = Math.min(Math.max(x, half + margin), w - half - margin);
        el.style.setProperty("--tail-x", `${Math.min(Math.max(50 + ((x - cx) / el.offsetWidth) * 100, 10), 90).toFixed(0)}%`);
        const dy = below ? "12px" : "calc(-100% - 12px)";
        el.style.transform = `translate(${(cx - half).toFixed(0)}px, ${y.toFixed(0)}px) translateY(${dy})`;
        el.style.display = labelAnchor.z < 1 ? "" : "none";
      });
    }

    function refreshTaskUI() {
      const step = currentStep();
      if (!lesson.active || !step) { setChip(""); return; }
      if (step.action === "tapBodies") setChip(TASK_TEXT.tapBodies(lesson.taps.size), lesson.done);
      else if (step.action === "orbitOnce") {
        const pct = Math.min(100, Math.round((lesson.travel / TAU) * 100));
        setChip(`${TASK_TEXT.orbitOnce} <span class="meter"><span style="width:${pct}%"></span></span> ${pct}%`, lesson.done);
      } else setChip("");
    }

    function markActionDone() {
      if (lesson.done) return;
      lesson.done = true;
      refreshTaskUI();
      Guides.allowNext();
      Guides.cheer(TASK_TEXT.done, 0);
    }

    function runStep() {
      const step = currentStep();
      const key = `${lesson.chapter}.${lesson.step}`;
      if (lesson.stepKey !== key) {           // a fresh step (not just showing the same one again)
        lesson.stepKey = key;
        lesson.done = isActionAlreadyDone(step.action);
        lesson.taps = new Set();
        lesson.travel = 0;
        if (step.action !== "tapBodies") clearFacts();
        applyEffects(step.sceneEffect);
      }
      refreshTaskUI();
      if (step.quiz) renderQuiz(step); else hideQuiz();
      const token = ++lesson.token;
      const actions = [];
      if (step.action === "groundSolar") actions.push({ label: "See it from Earth! 🌍", onClick: () => openGroundView("solar") });
      if (step.action === "groundLunar") actions.push({ label: "See it from Earth! 🌍", onClick: () => openGroundView("lunar") });
      const line = {
        guide: step.guide, text: step.text, more: step.more, icon: step.icon, lockSeconds: step.lockSeconds,
        next: (!step.action && !step.quiz) || step.optional || lesson.done,
        actions,
      };
      Guides.say([line], { tag: "lesson" }).then((finished) => {
        if (finished && token === lesson.token && lesson.active) advance();
      });
      if (lesson.done && step.action && !step.optional) Guides.cheer(TASK_TEXT.done, 0);
      if (lesson.done && step.quiz) Guides.cheer(step.quiz.praise, 0);
    }

    function advance() {
      lesson.step++;
      if (lesson.step < LESSONS[lesson.chapter].steps.length) { runStep(); return; }
      // Chapter finished
      lesson.completed.add(lesson.chapter);
      clearFacts();
      hideQuiz();
      emit("chapterdone", { chapter: lesson.chapter, id: LESSONS[lesson.chapter].id });
      const next = LESSONS[lesson.chapter + 1];
      if (next && next.freePlay) { freePlay.unlocked = true; startFreePlay({ greet: false }); }
      else if (next) startChapter(lesson.chapter + 1);
      else endLessons();
      saveProgress();
    }

    function startChapter(i) {
      const c = LESSONS[i];
      if (!c || ground.open) return;
      if (c.freePlay) { startFreePlay(); return; }
      freePlay.active = false;
      lesson.active = true;
      reactions.enabled = false;
      lesson.chapter = i;
      lesson.step = 0;
      lesson.stepKey = null;
      clearFacts();
      applyEffects(c.setup);
      renderProgress();
      emit("chapterstart", { chapter: i, id: c.id });
      saveProgress();
      runStep();
    }

    /** Free play: move the Moon anywhere; the guides only pop up briefly when an eclipse happens. */
    function startFreePlay({ greet = true } = {}) {
      if (!freePlay.unlocked || ground.open) return;
      lesson.active = false;
      lesson.token++;                 // ignore any lesson bubble still on screen
      freePlay.active = true;
      reactions.enabled = true;
      hideQuiz();
      setChip("");
      clearFacts();
      applyEffects(["hideLightRays"]);
      renderProgress();
      saveProgress();
      if (greet) Guides.say(SCRIPTS.freeStart, { tag: "free", autoHideMs: 7000 });
      else Guides.hide();
      emit("freeplay", { on: true });
    }

    function endLessons() {
      lesson.active = false;
      reactions.enabled = true;
      setChip("");
      clearFacts();
      hideQuiz();
      renderProgress();
      emit("lessonsdone");
    }

    /** On load: pick up where the child left off (or start at chapter 1). */
    function startLessons() {
      const saved = loadProgress();
      if (!saved) { startChapter(0); return; }
      (saved.completed || []).forEach((id) => {
        const i = LESSONS.findIndex((c) => c.id === id);
        if (i >= 0) lesson.completed.add(i);
      });
      freePlay.unlocked = Boolean(saved.freePlay);
      const resume = LESSONS.findIndex((c) => c.id === saved.current);
      if (resume >= 0) startChapter(resume);
      else if (freePlay.unlocked) startFreePlay();
      else startChapter(Math.max(0, LESSONS.findIndex((c, i) => !c.freePlay && !lesson.completed.has(i))));
    }

    // --- What the child does → lesson actions ---
    const onAction = (fn) => (e) => {
      if (!lesson.active) return;
      const step = currentStep();
      if (step && step.action) fn(step, e.detail || {});
    };
    events.addEventListener("bodytap", onAction((step, d) => {
      if (step.action !== "tapBodies") return;
      showFact(d.body);
      lesson.taps.add(d.body);
      refreshTaskUI();
      if (lesson.taps.size === 3) markActionDone();
    }));
    events.addEventListener("moonpush", onAction((step, d) => {
      if (step.action !== "orbitOnce" || lesson.done) return;
      lesson.travel += Math.min(Math.abs(d.delta), deg(40)); // big jumps (finger crossing Earth) count a little
      refreshTaskUI();
      if (lesson.travel >= TAU) markActionDone();
    }));
    events.addEventListener("alignment", onAction((step, d) => {
      if ((step.action === "alignSolar" && d.type === "solar") || (step.action === "alignLunar" && d.type === "lunar")) markActionDone();
    }));
    events.addEventListener("near", onAction((step, d) => {
      const want = step.action === "alignSolar" ? "solar" : step.action === "alignLunar" ? "lunar" : null;
      if (want && d.type === want && !lesson.done) Guides.cheer(TASK_TEXT.almost);
    }));
    events.addEventListener("redmoon", onAction((step, d) => {
      if (step.action === "redMoon" && d.on) markActionDone();
    }));
    events.addEventListener("groundphase", onAction((step, d) => {
      if (d.phase === "done" && step.action === `ground${d.type === "solar" ? "Solar" : "Lunar"}`) lesson.done = true;
    }));
    // Back from the ground view: move on if the eclipse was watched, otherwise show the step again.
    events.addEventListener("groundview", (e) => {
      if (!lesson.active || e.detail.open) return;
      const step = currentStep();
      if (step && step.action && step.action.startsWith("ground") && lesson.done) advance();
      else runStep();
    });

    /* ---------- Free exploration: the guides react to what the child does ---------- */
    events.addEventListener("near", (e) => {
      if (reactions.enabled && e.detail.type && !ground.open) Guides.quick("kai", SCRIPTS.almost, 1800);
    });
    events.addEventListener("alignment", (e) => {
      if (!reactions.enabled || ground.open) return;
      const type = e.detail.type;
      if (!type) {
        if (String(Guides.tag).startsWith("align")) Guides.hide();
        return;
      }
      const script = freePlay.active
        ? (type === "solar" ? SCRIPTS.freeSolar : SCRIPTS.freeLunar)
        : (type === "solar" ? SCRIPTS.alignSolar : SCRIPTS.alignLunar);
      const lines = script.map((l) => ({
        ...l,
        actions: [{ label: "See it from Earth! 🌍", onClick: () => openGroundView(type) }],
      }));
      // In free play the guide only pops up briefly (stays if the child touches the bubble).
      Guides.say(lines, { tag: `align-${type}`, autoHideMs: freePlay.active ? 8000 : 0 });
    });
    events.addEventListener("redmoon", (e) => {
      if (!reactions.enabled || !e.detail.on || ground.open) return;
      if (freePlay.active) Guides.say(SCRIPTS.freeRed, { tag: "redmoon", autoHideMs: 8000 });
      else Guides.enqueue(SCRIPTS.redMoon, { tag: "redmoon" });
    });
    // The ground view always narrates its big moments, in lessons and in free exploration.
    events.addEventListener("groundphase", (e) => {
      if (e.detail.phase !== "total") return;
      if (e.detail.type === "solar") Guides.say(SCRIPTS.solarTotal, { tag: "ground" });
      else Guides.enqueue(SCRIPTS.redMoon, { tag: "ground" });
    });

    /* =====================================================================
       UI
       Sound effects, toggles, ground view, reset view, window resizing,
       loading overlay.
       ===================================================================== */

    // --- Sound effects (Web Audio, no files). Audio starts only after a tap. ---
    const Sound = {
      ctx: null,
      muted: false,
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          try { this.ctx = new AC(); } catch { return; }
        }
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
      },
      /** Soft airy whoosh when a guide arrives. */
      whoosh() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const ctx = this.ctx, t = ctx.currentTime, dur = 0.45;
        const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.2;
        filter.frequency.setValueAtTime(350, t);
        filter.frequency.exponentialRampToValueAtTime(1800, t + dur);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start(t);
        src.stop(t + dur);
      },
      /** Happy rising arpeggio for a right answer. */
      cheer() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          const t0 = t + i * 0.1;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (i === 3 ? 0.7 : 0.25));
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.8);
        });
      },
      /** Soft, friendly "try again" boop (never a buzzer). */
      boop() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(380, t);
        osc.frequency.exponentialRampToValueAtTime(290, t + 0.18);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.1, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      },
      /** Soft two-note chime. */
      ding() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        [[880, 0], [1318.5, 0.09]].forEach(([freq, delay]) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t + delay);
          gain.gain.exponentialRampToValueAtTime(0.22, t + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.9);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + 1);
        });
      },
    };
    window.addEventListener("pointerdown", () => Sound.unlock(), { capture: true });
    window.addEventListener("keydown", () => Sound.unlock(), { capture: true });

    const soundBtn = document.getElementById("btn-sound");
    soundBtn.addEventListener("click", () => {
      Sound.muted = !Sound.muted;
      soundBtn.textContent = Sound.muted ? "🔇" : "🔊";
      soundBtn.setAttribute("aria-label", Sound.muted ? "Sound effects off" : "Sound effects on");
      soundBtn.setAttribute("aria-pressed", String(!Sound.muted));
    });

    // --- Shadow cones toggle ---
    const conesBtn = document.getElementById("btn-cones");
    conesBtn.addEventListener("click", () => setShadowCones(!state.conesOn));
    events.addEventListener("cones", (e) => conesBtn.setAttribute("aria-pressed", String(e.detail.on)));

    /* ---------- Ground view ----------
       What people standing on Earth see. Solar: the Moon's dark disc slides over
       the Sun, the sky turns to dusk, stars come out, the corona glows. Lunar: at
       night, Earth's shadow slides over the full Moon and it turns coppery red.
       Events: "groundview" { type, open }, "groundphase" { type, phase }
       phases: "safety" (Kai's safety talk) → "playing" → "total" → "done" */
    const GROUND = {
      sun:  { x: 900, y: 250, r: 90 },
      moon: { x: 900, y: 240, r: 80 },   // lunar view
      umbraR: 210,                       // Earth's shadow is much wider than the Moon
      timing: { in: 4.5, hold: 3.5, out: 4 },
      sky: {
        day:   ["#3aa0ff", "#8fd0ff", "#d6f1ff"],
        dusk:  ["#0d1238", "#2a2463", "#ff9a62"], // totality: a sunset glow all around the horizon
        night: ["#070723", "#1a1650", "#33285e"],
      },
      city: {
        groundY: 770,
        quietZone: { x: 900, halfWidth: 270, maxTop: 430 }, // keep buildings below the Sun and Moon
        buildingDay: ["#8fa3c7", "#a7b6d6", "#7b8fb8", "#b9c4dd", "#9c93c9"],
        buildingNight: ["#1b2142", "#20264a", "#181d3c", "#232a50", "#1f1f45"],
        litAtNight: 0.65, // share of windows with the lights on
      },
    };
    const groundEl = document.getElementById("ground");
    const $g = (id) => document.getElementById(id);
    const ground = { open: false, type: null, phase: "idle", t: 0, totalAnnounced: false };

    // Stars for the ground sky (fixed pattern)
    {
      const rand = seededRandom(99);
      const ns = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 90; i++) {
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", (rand() * 1600).toFixed(0));
        c.setAttribute("cy", (rand() * 520).toFixed(0));
        c.setAttribute("r", (1.4 + rand() * 2.4).toFixed(1));
        c.setAttribute("fill", rand() > 0.8 ? "#fff3c4" : "#ffffff");
        $g("ground-stars").appendChild(c);
      }
    }

    function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`;
    }
    const smooth = (e0, e1, x) => { const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

    /** Fraction of a circle (radius r) covered by another circle of the same size, centres d apart. */
    function equalDiscOverlap(d, r) {
      if (d >= 2 * r) return 0;
      const a = 2 * r * r * Math.acos(d / (2 * r)) - (d / 2) * Math.sqrt(4 * r * r - d * d);
      return a / (Math.PI * r * r);
    }

    /** Offset of the moving disc over time: slide in, hold in the middle, slide out. */
    function slideOffset(t, dist) {
      const T = GROUND.timing;
      if (t < T.in) return -dist * (1 - smooth(0, 1, t / T.in));
      if (t < T.in + T.hold) return 0;
      return dist * smooth(0, 1, (t - T.in - T.hold) / T.out);
    }
    const groundDuration = () => GROUND.timing.in + GROUND.timing.hold + GROUND.timing.out;

    // --- Where are we watching from? Countryside or city ---
    const SCENE_KEY = "eclipse-explorer.groundScene";
    let groundScene = "country";
    try { if (localStorage.getItem(SCENE_KEY) === "city") groundScene = "city"; } catch { /* storage blocked: fine */ }

    /** City skyline: skyscrapers with window grids. Short buildings in the middle so the Sun and Moon stay visible. */
    function buildCity() {
      const C = GROUND.city;
      const ns = "http://www.w3.org/2000/svg";
      const root = $g("land-city");
      const el = (tag, attrs, parent = root) => {
        const n = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        parent.appendChild(n);
        return n;
      };
      const rand = seededRandom(2024);
      // All windows share two groups (lights on / lights off at night), so darkening repaints 2 shapes, not hundreds.
      const buildings = el("g", {});
      const winsLit = el("g", { "data-day": "#d8ecff", "data-night": "#ffd166" });
      const winsDark = el("g", { "data-day": "#d8ecff", "data-night": "#2b3260" });
      let tallest = null;
      for (let x = -20, i = 0; x < 1620; i++) {
        const w = 90 + Math.floor(rand() * 80);
        const centre = x + w / 2;
        const inQuietZone = Math.abs(centre - C.quietZone.x) < C.quietZone.halfWidth;
        const top = inQuietZone
          ? C.quietZone.maxTop + rand() * 120
          : 150 + rand() * 320;
        const h = C.groundY - top;
        const c = i % C.buildingDay.length;
        el("rect", { x, y: top, width: w, height: h + 2, rx: 4, "data-day": C.buildingDay[c], "data-night": C.buildingNight[c] }, buildings);
        if (!tallest || top < tallest.top) tallest = { x, w, top };
        // Window grid
        const cols = Math.max(2, Math.floor((w - 20) / 30));
        const gap = (w - cols * 16) / (cols + 1);
        for (let wy = top + 22; wy < C.groundY - 40; wy += 38) {
          for (let k = 0; k < cols; k++) {
            el("rect", { x: (x + gap + k * (16 + gap)).toFixed(1), y: wy.toFixed(0), width: 16, height: 22, rx: 2 },
              rand() < C.litAtNight ? winsLit : winsDark);
          }
        }
        x += w + 6 + Math.floor(rand() * 12);
      }
      // Antenna with a red light on the tallest tower
      el("rect", { x: tallest.x + tallest.w / 2 - 3, y: tallest.top - 60, width: 6, height: 60, "data-day": "#6b7aa3", "data-night": "#141834" });
      el("circle", { cx: tallest.x + tallest.w / 2, cy: tallest.top - 62, r: 7, "data-day": "#ff6b6b", "data-night": "#ff3b3b" });
      // Sidewalk, road and lane markings
      el("rect", { x: 0, y: C.groundY, width: 1600, height: 24, "data-day": "#c9ccd6", "data-night": "#2a2d45" });
      el("rect", { x: 0, y: C.groundY + 24, width: 1600, height: 140, "data-day": "#5b5f73", "data-night": "#141628" });
      const lanes = el("g", { "data-day": "#f5f5f5", "data-night": "#3a3d55" });
      for (let lx = 20; lx < 1600; lx += 120) el("rect", { x: lx, y: C.groundY + 82, width: 60, height: 10, rx: 5 }, lanes);
    }
    buildCity();

    let lastLandPaint = { scene: null, darkness: -1 };
    /** Blend every landscape shape between its day and night colour. */
    function paintLand(darkness) {
      if (lastLandPaint.scene === groundScene && Math.abs(lastLandPaint.darkness - darkness) < 0.004) return;
      lastLandPaint = { scene: groundScene, darkness };
      $g(groundScene === "city" ? "land-city" : "land-country")
        .querySelectorAll("[data-day]")
        .forEach((n) => n.setAttribute("fill", mixHex(n.dataset.day, n.dataset.night, darkness)));
    }

    function setGroundScene(scene) {
      groundScene = scene === "city" ? "city" : "country";
      try { localStorage.setItem(SCENE_KEY, groundScene); } catch { /* fine without it */ }
      $g("land-country").style.display = groundScene === "country" ? "" : "none";
      $g("land-city").style.display = groundScene === "city" ? "" : "none";
      document.querySelectorAll("#scene-switch button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.scene === groundScene)));
      lastLandPaint.scene = null; // force a repaint
      if (ground.open) renderGround();
      emit("groundscene", { scene: groundScene });
    }
    document.querySelectorAll("#scene-switch button").forEach((b) =>
      b.addEventListener("click", () => setGroundScene(b.dataset.scene)));
    setGroundScene(groundScene); // apply the remembered choice
    function paintSky(from, to, t) {
      ["top", "mid", "bottom"].forEach((k, i) => $g(`g-sky-${k}`).setAttribute("stop-color", mixHex(from[i], to[i], t)));
    }

    function renderGround() {
      const t = ground.t;
      if (ground.type === "solar") {
        const S = GROUND.sun;
        const dx = slideOffset(t, S.r * 3.4);
        const mx = S.x + dx, my = S.y + dx * 0.12;
        $g("smoon-disc").setAttribute("cx", mx.toFixed(1));
        $g("smoon-disc").setAttribute("cy", my.toFixed(1));
        const coverage = equalDiscOverlap(Math.hypot(mx - S.x, my - S.y), S.r);
        // A new Moon is hard to see in daytime: faint while far away, solid once it bites the Sun.
        const nearSun = smooth(S.r * 3.2, S.r * 2, Math.hypot(mx - S.x, my - S.y));
        $g("smoon-disc").setAttribute("opacity", (0.3 + 0.7 * nearSun).toFixed(3));
        const dark = smooth(0.55, 1, coverage);           // the sky stays bright until the Sun is almost gone
        paintSky(GROUND.sky.day, GROUND.sky.dusk, dark);
        paintLand(dark);
        $g("ground-stars").setAttribute("opacity", smooth(0.85, 1, coverage).toFixed(3));
        $g("sun-corona").setAttribute("opacity", smooth(0.95, 0.999, coverage).toFixed(3));
        $g("sun-glow").setAttribute("opacity", (1 - 0.95 * smooth(0.6, 1, coverage)).toFixed(3));
        groundEl.style.background = mixHex(GROUND.sky.day[0], GROUND.sky.dusk[0], dark);
        return coverage > 0.995;
      } else {
        const M = GROUND.moon, R = GROUND.umbraR;
        const dx = slideOffset(t, R + M.r + 60);
        $g("lmoon-umbra").setAttribute("cx", (M.x + dx).toFixed(1));
        $g("lmoon-umbra").setAttribute("cy", (M.y + dx * 0.1).toFixed(1));
        const dist = Math.hypot(dx, dx * 0.1);
        const red = smooth(R - M.r + 40, R - M.r, dist);   // fully inside Earth's shadow → copper red
        const covered = smooth(R + M.r, R - M.r, dist);
        $g("lmoon-red").setAttribute("opacity", red.toFixed(3));
        $g("lmoon-halo").setAttribute("opacity", (1 - 0.9 * covered).toFixed(3));
        $g("lmoon-redhalo").setAttribute("opacity", red.toFixed(3));
        paintSky(GROUND.sky.night, GROUND.sky.night, 0);
        paintLand(1);
        $g("ground-stars").setAttribute("opacity", (0.75 + 0.25 * covered).toFixed(3));
        groundEl.style.background = GROUND.sky.night[0];
        return red > 0.98;
      }
    }

    function setGroundPhase(phase) {
      ground.phase = phase;
      emit("groundphase", { type: ground.type, phase });
      $g("btn-replay").hidden = phase !== "done";
    }

    function startGroundAnimation() {
      ground.t = 0;
      ground.totalAnnounced = false;
      $g("ground-top").hidden = false;
      setGroundPhase("playing");
    }

    function openGroundView(type) {
      if (ground.open) return;
      ground.open = true;
      ground.type = type;
      ground.t = 0;
      $g("solar-sky").style.display = type === "solar" ? "" : "none";
      $g("lunar-sky").style.display = type === "lunar" ? "" : "none";
      renderGround();
      document.body.classList.add("ground-open");
      groundEl.classList.add("open");
      groundEl.setAttribute("aria-hidden", "false");
      refreshGroundButton();
      emit("groundview", { type, open: true });

      if (type === "solar") {
        // Safety first: Kai's warning (its Next is locked for 2 seconds), and the
        // eclipse only plays once the child has gone through the whole safety talk.
        $g("ground-top").hidden = true;
        setGroundPhase("safety");
        Guides.say(SCRIPTS.solarSafety, { tag: "safety" }).then(() => {
          if (ground.open && ground.phase === "safety") startGroundAnimation();
        });
      } else {
        $g("ground-top").hidden = false;
        startGroundAnimation();
        Guides.say(SCRIPTS.lunarSafe, { tag: "ground" });
      }
    }

    function closeGroundView() {
      if (!ground.open || ground.phase === "safety") return;
      ground.open = false;
      ground.phase = "idle";
      groundEl.classList.remove("open");
      document.body.classList.remove("ground-open");
      groundEl.setAttribute("aria-hidden", "true");
      Guides.hide();
      clock.getDelta(); // don't let the 3D scene jump after a long pause
      refreshGroundButton();
      emit("groundview", { type: ground.type, open: false });
    }

    /** Called every frame while the ground view is open. */
    function updateGround(dt) {
      if (ground.phase !== "playing" && ground.phase !== "total") return;
      ground.t = Math.min(groundDuration(), ground.t + dt);
      const total = renderGround();
      if (total && !ground.totalAnnounced) { ground.totalAnnounced = true; setGroundPhase("total"); }
      if (ground.t >= groundDuration()) setGroundPhase("done");
    }

    $g("btn-back-space").addEventListener("click", closeGroundView);
    $g("btn-replay").addEventListener("click", startGroundAnimation);
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeGroundView(); });

    // "See it from Earth!" appears once the Moon is snapped into a line-up.
    const groundBtn = $g("btn-ground");
    function refreshGroundButton() {
      groundBtn.hidden = !(state.aligned && !ground.open && groundButtonEnabled);
    }
    let groundButtonEnabled = true; // lessons can switch this off
    groundBtn.addEventListener("click", () => { if (state.aligned) openGroundView(state.aligned); });
    events.addEventListener("alignment", refreshGroundButton);

    let cameraTween = null; // { from, to, fromTarget, t }
    let cameraIsHome = true; // false once the child moves the camera themselves

    function resetView() {
      cameraIsHome = true;
      cameraTween = {
        from: camera.position.clone(),
        to: homeCameraPosition(),
        fromTarget: controls.target.clone(),
        t: CONFIG.reducedMotion ? 1 : 0,
      };
    }
    document.getElementById("btn-reset-view").addEventListener("click", resetView);
    // Any manual camera move cancels a reset animation in progress.
    controls.addEventListener("start", () => { cameraTween = null; cameraIsHome = false; });

    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return; // hidden tab / zero-size frame: keep the last good size
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      // Tall, narrow screens need to back further away to fit Sun, Earth and Moon.
      controls.maxDistance = Math.max(CONFIG.camera.maxDistance, fitDistance() * 1.25);
      // If the page started while hidden, the camera may never have been placed properly.
      // Rotating a tablet or resizing the window re-fits the view, unless the child moved it.
      const p = camera.position;
      if (cameraIsHome || !Number.isFinite(p.x + p.y + p.z) || p.lengthSq() === 0) {
        cameraTween = null;
        camera.position.copy(homeCameraPosition());
        controls.target.copy(CONFIG.camera.target);
      }
    }
    window.addEventListener("resize", onResize);
    onResize();
    camera.position.copy(homeCameraPosition());
    controls.update();

    // Tiny hook for testing from the browser console during development.
    window.__eclipse = {
      /** Jump the Moon straight to an angle (radians; PI = solar line-up, 0 = lunar). */
      setMoonAngle(a) { setRawAngle(a); state.moonAngle = state.targetAngle; placeMoon(state.moonAngle); },
      /** Push the Moon like a finger would (snapping applies). */
      pushMoon(a) { setRawAngle(a); },
      get state() { return { ...state }; },
      setShadowCones, openGroundView, closeGroundView,
      get ground() { return { ...ground }; },
      /** Jump the ground-view animation to a time in seconds (for checking frames). */
      seekGround(t) { ground.t = t; renderGround(); },
      setGroundScene,
      Guides, SCRIPTS, reactions, LESSONS, startChapter,
      get lesson() { return { ...lesson, completed: [...lesson.completed] }; },
      get freePlay() { return { ...freePlay }; },
      startFreePlay, resetProgress, saveProgress,
      tapBody(body) { emit("bodytap", { body }); },
      events,
      THREE, scene, camera, renderer, controls, homeCameraPosition,
    };

    /* =====================================================================
       MAIN LOOP
       ===================================================================== */
    const clock = new THREE.Clock();
    const easeInOut = (t) => t * t * (3 - 2 * t);

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.elapsedTime;

      // While the ground view fully covers the screen, pause the 3D scene to save battery.
      if (ground.open) {
        updateGround(dt);
        if (groundEl.classList.contains("open") && getComputedStyle(groundEl).opacity === "1") {
          requestAnimationFrame(tick);
          return;
        }
      }

      earth.rotation.y += dt * CONFIG.earth.spinSpeed;
      updateMoon(dt);
      updateEclipseEffects(dt);
      updateLightRays(dt);
      updateFactLabels();

      if (!CONFIG.reducedMotion) {
        sunGlow.scale.setScalar(CONFIG.sun.glowSize * (1 + Math.sin(t * 1.6) * 0.025));
      }

      if (cameraTween) {
        cameraTween.t = Math.min(1, cameraTween.t + dt / 0.9);
        const k = easeInOut(cameraTween.t);
        camera.position.lerpVectors(cameraTween.from, cameraTween.to, k);
        controls.target.lerpVectors(cameraTween.fromTarget, CONFIG.camera.target, k);
        if (cameraTween.t >= 1) cameraTween = null;
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(() => {
      tick();
      window.__eclipseReady = true;
      document.getElementById("overlay").classList.add("hidden");
      setTimeout(startLessons, CONFIG.reducedMotion ? 0 : 700);
    });
  </script>
</body>
</html>
