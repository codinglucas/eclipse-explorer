    }
    const startOverBtn = document.getElementById("btn-start-over");
    startOverBtn.addEventListener("click", () => {
      // A grown-up check, so a curious finger doesn't wipe a child's progress by accident.
      if (window.confirm("Start all the lessons again from chapter 1?")) resetProgress();
    });
    function resetProgress() {
      try { localStorage.removeItem(PROGRESS_KEY); } catch { /* fine */ }
      lesson.completed.clear();
      freePlay.unlocked = false;
      freePlay.active = false;
      startChapter(0);
    }

    // --- Quiz ---
    const quizSteps = (c) => c.steps.filter((st) => st.quiz);
    function hideQuiz() { quizEl.hidden = true; quizAnswersEl.replaceChildren(); }
    function renderQuiz(step) {
      const all = quizSteps(LESSONS[lesson.chapter]);
      quizCountEl.textContent = TASK_TEXT.quizCount(all.indexOf(step) + 1, all.length);
      quizAnswersEl.classList.toggle("solved", lesson.done);
      quizAnswersEl.replaceChildren(...step.quiz.answers.map((a) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "quiz-answer";
        if (a.picture) b.insertAdjacentHTML("beforeend", QUIZ_PICTURES[a.picture]());
        if (a.emoji) b.insertAdjacentHTML("beforeend", `<span class="big-emoji" aria-hidden="true">${a.emoji}</span>`);
        if (a.label) b.insertAdjacentHTML("beforeend", `<span>${a.label}</span>`);
        b.setAttribute("aria-label", a.alt || a.label);
        if (lesson.done && a.correct) b.classList.add("right");
        b.addEventListener("click", () => answerQuiz(step, a, b));
        return b;
      }));
      quizEl.hidden = false;
    }
    function answerQuiz(step, answer, button) {
      if (lesson.done || button.classList.contains("wrong")) return;
      if (answer.correct) {
        button.classList.add("right");
        quizAnswersEl.classList.add("solved");
        Sound.cheer();
        confetti();
        lesson.done = true;
        Guides.allowNext();
        Guides.cheer(step.quiz.praise, 0);
        emit("quizanswer", { id: step.id, correct: true });
      } else {
        button.classList.add("wrong");
        button.setAttribute("aria-disabled", "true");
        Sound.boop();
        Guides.cheer(step.quiz.hint, 0); // gentle hint, then another try
        emit("quizanswer", { id: step.id, correct: false });
      }
    }

    // --- Confetti (skipped with reduced motion) ---
    const confettiCanvas = document.getElementById("confetti");
    const confettiCtx = confettiCanvas.getContext("2d");
    let confettiBits = [], confettiRunning = false;
    function confetti() {
      if (CONFIG.reducedMotion) return;
      const w = (confettiCanvas.width = window.innerWidth), h = (confettiCanvas.height = window.innerHeight);
      const colors = ["#ffd23f", "#ff8fab", "#7bd389", "#7fc8ff", "#b9a7ff", "#ff9f43"];
      for (let i = 0; i < 140; i++) {
        confettiBits.push({
          x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: h * 0.35,
          vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 10,
          r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          s: 7 + Math.random() * 7, c: colors[i % colors.length], life: 0,
        });
      }
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
    }
    function confettiFrame() {
      const w = confettiCanvas.width, h = confettiCanvas.height;
      confettiCtx.clearRect(0, 0, w, h);
      confettiBits = confettiBits.filter((b) => b.y < h + 20 && b.life < 240);
      confettiBits.forEach((b) => {
        b.life++; b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        confettiCtx.save();
        confettiCtx.translate(b.x, b.y);
        confettiCtx.rotate(b.r);
        confettiCtx.fillStyle = b.c;
        confettiCtx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        confettiCtx.restore();
      });
      if (confettiBits.length) requestAnimationFrame(confettiFrame);
      else { confettiRunning = false; confettiCtx.clearRect(0, 0, w, h); }
    }

    const currentStep = () => LESSONS[lesson.chapter].steps[lesson.step];
    const freePlayIndex = () => LESSONS.findIndex((c) => c.freePlay);

    const MOON_START = Math.PI / 2;
    const MOON_TASKS = new Set(["orbitOnce", "alignSolar", "alignLunar"]);

    function applyEffects(effects) {
      [].concat(effects || []).forEach((fx) => {
        if (fx === "showShadowCones") setShadowCones(true);
        else if (fx === "hideShadowCones") setShadowCones(false);
        else if (fx === "showLightRays") setLightRays(true);
        else if (fx === "hideLightRays") setLightRays(false);
        else if (fx === "showSunsetLight") setSunsetLight(true);
        else if (fx === "hideSunsetLight") setSunsetLight(false);
        else if (fx === "resetView") resetView();
        else if (fx === "moonStart") setRawAngle(MOON_START); // behind Earth (top of the screen), 90° from both line-ups
      });
    }

    function isActionAlreadyDone(action) {
      if (action === "alignSolar") return state.aligned === "solar";
      if (action === "alignLunar") return state.aligned === "lunar";
      if (action === "redMoon") return state.redness > 0.9;
      return false;
    }

    function renderProgress() {
      const c = LESSONS[lesson.chapter];
      titleEl.textContent = lesson.active ? `${lesson.chapter + 1} · ${c.title}`
        : freePlay.active ? "🎉 Free play" : "You finished the lessons! 🎉";
      progressEl.hidden = !learning.on; // no chapter title while exploring freely
      startOverBtn.hidden = !(lesson.completed.size > 0 || freePlay.unlocked);
    }

    function setChip(html, done = false) {
      chipEl.innerHTML = html;
      chipEl.hidden = !html;
      chipEl.classList.toggle("done", done);
    }

    // --- Fact labels that float above the bodies in chapter 1 ---
    const factLabels = new Map(); // body → element
    const labelAnchor = new THREE.Vector3();
    function showFact(body) {
      if (factLabels.has(body)) return;
      const el = document.createElement("div");
      el.className = "fact-label";
      el.textContent = BODY_FACTS[body];
      if (body === "moon") el.classList.add("below"); // keeps the Moon's label off Earth's
      labelsEl.appendChild(el);
      factLabels.set(body, el);
    }
    function clearFacts() {
      factLabels.forEach((el, key) => { if (!key.endsWith("-real")) { el.remove(); factLabels.delete(key); } });
    }
    function updateFactLabels() {
      if (!factLabels.size) return;
      const w = window.innerWidth, h = window.innerHeight;
      factLabels.forEach((el, body) => {
        const below = el.classList.contains("below");
        if (body === "sun") labelAnchor.copy(sun.position).y += CONFIG.sun.radius + 1;
        else if (body === "earth") labelAnchor.copy(earthSystem.position).y += CONFIG.earth.radius + 0.8;
        else if (body === "earth-real") labelAnchor.copy(earthSystem.position).y -= sizes.earthRadius + 0.6;
        else if (body === "moon-real") { moon.getWorldPosition(labelAnchor); labelAnchor.y += sizes.moonRadius + 0.6; }
        else { moon.getWorldPosition(labelAnchor); labelAnchor.y -= CONFIG.moon.radius + 0.5; }
        labelAnchor.project(camera);
        const x = (labelAnchor.x * 0.5 + 0.5) * w, y = (-labelAnchor.y * 0.5 + 0.5) * h;
        // Keep the label on screen; the little tail still points at the body.
        if (!el._w) el._w = el.offsetWidth;   // measure once; reading layout every frame is slow on tablets
        const half = el._w / 2, margin = 12;
        const cx = Math.min(Math.max(x, half + margin), w - half - margin);
        el.style.setProperty("--tail-x", `${Math.min(Math.max(50 + ((x - cx) / el._w) * 100, 10), 90).toFixed(0)}%`);
        const dy = below ? "12px" : "calc(-100% - 12px)";
        el.style.transform = `translate(${(cx - half).toFixed(0)}px, ${y.toFixed(0)}px) translateY(${dy})`;
        el.style.display = labelAnchor.z < 1 ? "" : "none";
      });
    }

    function refreshTaskUI() {
      const step = currentStep();
      if (!lesson.active || !step) { setChip(""); return; }
      if (step.action === "tapBodies") setChip(TASK_TEXT.tapBodies(lesson.taps.size), lesson.done);
      else if (step.action === "orbitOnce") {
        const pct = Math.min(100, Math.round((lesson.travel / TAU) * 100));
        setChip(`${TASK_TEXT.orbitOnce} <span class="meter"><span style="width:${pct}%"></span></span> ${pct}%`, lesson.done);
      } else setChip("");
    }

    function markActionDone() {
      if (lesson.done) return;
      lesson.done = true;
      refreshTaskUI();
      Guides.allowNext();
      Guides.cheer(TASK_TEXT.done, 0);
    }

    function runStep() {
      const step = currentStep();
      const key = `${lesson.chapter}.${lesson.step}`;
      if (lesson.stepKey !== key) {           // a fresh step (not just showing the same one again)
        lesson.stepKey = key;
        // Your turn: the Moon stops travelling by itself and waits for the child. For a line-up task it
        // waits at the start spot, so it can't happen to stop right on the answer.
        if (autoplay.on && MOON_TASKS.has(step.action)) {
          setAutoplay(false, { moonTo: step.action === "orbitOnce" ? null : MOON_START });
        }
        lesson.done = isActionAlreadyDone(step.action);
        lesson.taps = new Set();
        lesson.travel = 0;
        if (step.action !== "tapBodies") clearFacts();
        applyEffects(step.sceneEffect);
      }
      refreshTaskUI();
      if (step.quiz) renderQuiz(step); else hideQuiz();
      const token = ++lesson.token;
      const actions = [];
      if (step.action === "groundSolar") actions.push({ label: "See it from Earth! 🌍", onClick: () => openGroundView("solar") });
      if (step.action === "groundLunar") actions.push({ label: "See it from Earth! 🌍", onClick: () => openGroundView("lunar") });
      const line = {
        guide: step.guide, text: step.text, more: step.more, icon: step.icon, lockSeconds: step.lockSeconds,
        next: (!step.action && !step.quiz) || step.optional || lesson.done,
        actions,
      };
      Guides.say([line], { tag: "lesson" }).then((finished) => {
        if (finished && token === lesson.token && lesson.active) advance();
      });
      if (lesson.done && step.action && !step.optional) Guides.cheer(TASK_TEXT.done, 0);
      if (lesson.done && step.quiz) Guides.cheer(step.quiz.praise, 0);
    }

    function advance() {
      lesson.step++;
      if (lesson.step < LESSONS[lesson.chapter].steps.length) { runStep(); return; }
      // Chapter finished
      lesson.completed.add(lesson.chapter);
      clearFacts();
      hideQuiz();
      emit("chapterdone", { chapter: lesson.chapter, id: LESSONS[lesson.chapter].id });
      const next = LESSONS[lesson.chapter + 1];
      if (next && next.freePlay) { freePlay.unlocked = true; startFreePlay({ greet: false }); }
      else if (next) startChapter(lesson.chapter + 1);
      else endLessons();
      saveProgress();
    }

    function startChapter(i) {
      const c = LESSONS[i];
      if (!c || ground.open) return;
      if (realScale.on) setRealScale(false, { resume: false }); // lessons use the friendly view
      Guides.setQuiet(false); // starting a chapter brings the guides back
      if (!learning.on) { learning.on = true; saveLearning(); refreshLearningUI(); }
      if (c.freePlay) { startFreePlay(); return; }
      freePlay.active = false;
      lesson.active = true;
      reactions.enabled = false;
      lesson.chapter = i;
      lesson.step = 0;
      lesson.stepKey = null;
      clearFacts();
      applyEffects(c.setup);
      setSunsetLight(false); // like the cones and rays, every chapter starts without the helper drawings
      renderProgress();
      emit("chapterstart", { chapter: i, id: c.id });
      saveProgress();
      runStep();
    }

    /** Free play: move the Moon anywhere; the guides only pop up briefly when an eclipse happens. */
    function startFreePlay({ greet = true } = {}) {
      if (!freePlay.unlocked || ground.open) return;
      lesson.active = false;
      lesson.token++;                 // ignore any lesson bubble still on screen
      freePlay.active = true;
      reactions.enabled = true;
      hideQuiz();
      setChip("");
      clearFacts();
      applyEffects(["hideLightRays"]);
      renderProgress();
      saveProgress();
      if (greet) Guides.say(SCRIPTS.freeStart, { tag: "free", autoHideMs: 7000 });
      else Guides.hide();
      emit("freeplay", { on: true });
    }

    function endLessons() {
      lesson.active = false;
      reactions.enabled = true;
      setChip("");
      clearFacts();
      hideQuiz();
      renderProgress();
      emit("lessonsdone");
    }

    /* ---------- 🎓 Learning mode (in ⚙️ settings) ----------
       On: the guided lessons. Off: explore freely, like free play, with no
       lessons and no chapter bar; the guides only pop up briefly on an eclipse.
       Turning it back on continues the lesson where the child left it. */
    const LEARNING_KEY = "eclipse-explorer.learning";
    const learning = { on: true, paused: false };
    try { learning.on = localStorage.getItem(LEARNING_KEY) !== "0"; } catch { /* fine */ }
    let savedResume = -1; // chapter to pick up when lessons start
    const learningBtn = document.getElementById("btn-learning");

    function saveLearning() {
      try { localStorage.setItem(LEARNING_KEY, learning.on ? "1" : "0"); } catch { /* fine */ }
    }
    function refreshLearningUI() {
      learningBtn.setAttribute("aria-pressed", String(learning.on));
      document.getElementById("learning-sub").textContent = learning.on
        ? "Lessons with Proxima and Kai" : "Explore freely, no lessons";
    }

    function enterExplore({ greet = true } = {}) {
      learning.paused = lesson.active; // remember the lesson to continue later
      lesson.active = false;
      lesson.token++;                  // ignore the lesson bubble still on screen
      freePlay.active = true;          // reuse free play's brief guide pop-ups
      reactions.enabled = true;
      hideQuiz();
      setChip("");
      clearFacts();
      applyEffects(["hideLightRays"]);
      renderProgress();
      if (greet) Guides.say(SCRIPTS.freeStart, { tag: "free", autoHideMs: 7000 });
      else Guides.hide();
    }

    function resumeLearning() {
      if (realScale.on) setRealScale(false, { resume: false });
      freePlay.active = false;
      if (learning.paused) {
        learning.paused = false;
        lesson.active = true;
        reactions.enabled = false;
        lesson.stepKey = null;           // show the step fresh (its scene effects come back)
        applyEffects(LESSONS[lesson.chapter].setup);
        renderProgress();
        runStep();
      } else {
        resumeFromSaved();
      }
    }

    function setLearningMode(on) {
      if (learning.on === on || ground.open) return;
      learning.on = on;
      saveLearning();
      refreshLearningUI();
      Guides.setQuiet(false); // flipping the switch either way brings the guides back
      if (on) resumeLearning(); else enterExplore();
      emit("learningmode", { on });
    }
    // ✕ on a speech bubble closes the tutorial: lessons switch off without a goodbye bubble,
    // and stay off (also after a reload) until Learning mode is switched on again in ⚙️.
    events.addEventListener("guidesclosed", () => {
      if (!learning.on) return;
      learning.on = false;
      saveLearning();
      refreshLearningUI();
      enterExplore({ greet: false });
      emit("learningmode", { on: false });
    });
    learningBtn.addEventListener("click", () => setLearningMode(!learning.on));
    refreshLearningUI(); // the switch shows the saved choice right away

    function resumeFromSaved() {
      if (savedResume >= 0) { const i = savedResume; savedResume = -1; startChapter(i); }
      else if (freePlay.unlocked && lesson.completed.size) startFreePlay();
      else startChapter(Math.max(0, LESSONS.findIndex((c, i) => !c.freePlay && !lesson.completed.has(i))));
    }

    /** On load: pick up where the child left off (or start at chapter 1). */
    function startLessons() {
      const saved = loadProgress();
      if (saved) {
        (saved.completed || []).forEach((id) => {
          const i = LESSONS.findIndex((c) => c.id === id);
          if (i >= 0) lesson.completed.add(i);
        });
        freePlay.unlocked = Boolean(saved.freePlay);
        savedResume = LESSONS.findIndex((c) => c.id === saved.current);
      }
      refreshLearningUI();
      if (learning.on) resumeFromSaved();
      else enterExplore();
    }

    // --- What the child does → lesson actions ---
    const onAction = (fn) => (e) => {
      if (!lesson.active || realScale.on) return; // lessons pause while real sizes are on
      const step = currentStep();
      if (step && step.action) fn(step, e.detail || {});
    };
    events.addEventListener("bodytap", onAction((step, d) => {
      if (step.action !== "tapBodies") return;
      showFact(d.body);
      lesson.taps.add(d.body);
      refreshTaskUI();
      if (lesson.taps.size === 3) markActionDone();
    }));
    events.addEventListener("moonpush", onAction((step, d) => {
      if (step.action !== "orbitOnce" || lesson.done) return;
      lesson.travel += Math.min(Math.abs(d.delta), deg(40)); // big jumps (finger crossing Earth) count a little
      refreshTaskUI();
      if (lesson.travel >= TAU) markActionDone();
    }));
    events.addEventListener("alignment", onAction((step, d) => {
      if ((step.action === "alignSolar" && d.type === "solar") || (step.action === "alignLunar" && d.type === "lunar")) markActionDone();
    }));
    events.addEventListener("near", onAction((step, d) => {
      const want = step.action === "alignSolar" ? "solar" : step.action === "alignLunar" ? "lunar" : null;
      if (want && d.type === want && !lesson.done) Guides.cheer(TASK_TEXT.almost);
    }));
    events.addEventListener("redmoon", onAction((step, d) => {
      if (step.action === "redMoon" && d.on) markActionDone();
    }));
    events.addEventListener("groundphase", onAction((step, d) => {
      if (d.phase === "done" && step.action === `ground${d.type === "solar" ? "Solar" : "Lunar"}`) lesson.done = true;
    }));
    // Back from the ground view: move on if the eclipse was watched, otherwise show the step again.
    events.addEventListener("groundview", (e) => {
      if (!lesson.active || e.detail.open) return;
      const step = currentStep();
      if (step && step.action && step.action.startsWith("ground") && lesson.done) advance();
      else runStep();
    });

    /* ---------- Free exploration: the guides react to what the child does ---------- */
    events.addEventListener("near", (e) => {
      if (reactions.enabled && e.detail.type && !ground.open) Guides.quick("kai", SCRIPTS.almost, 1800);
    });
    events.addEventListener("alignment", (e) => {
      if (!reactions.enabled || ground.open) return;
      const type = e.detail.type;
      if (!type) {
        if (String(Guides.tag).startsWith("align")) Guides.hide();
        return;
      }
      const script = freePlay.active
        ? (type === "solar" ? SCRIPTS.freeSolar : SCRIPTS.freeLunar)
        : (type === "solar" ? SCRIPTS.alignSolar : SCRIPTS.alignLunar);
      // In free play the guide only pops up briefly (stays if the child touches the bubble).
      Guides.say(script, { tag: `align-${type}`, autoHideMs: freePlay.active ? 8000 : 0 });
    });
    events.addEventListener("redmoon", (e) => {
      if (!reactions.enabled || !e.detail.on || ground.open) return;
      if (freePlay.active) Guides.say(SCRIPTS.freeRed, { tag: "redmoon", autoHideMs: 8000 });
      else Guides.enqueue(SCRIPTS.redMoon, { tag: "redmoon" });
    });
    // The ground view always narrates its big moments, in lessons and in free exploration.
    events.addEventListener("groundphase", (e) => {
      if (e.detail.phase !== "total") return;
      if (e.detail.type === "solar") Guides.say(SCRIPTS.solarTotal, { tag: "ground" });
      else Guides.enqueue(SCRIPTS.redMoon, { tag: "ground" });
    });

    /* =====================================================================
       UI
       Sound effects, toggles, ground view, reset view, window resizing,
       loading overlay.
       ===================================================================== */

    // --- Sound effects (Web Audio, no files). Audio starts only after a tap. ---
    const Sound = {
      ctx: null,
      muted: false,
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          try { this.ctx = new AC(); } catch { return; }
        }
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
      },
      /** Soft airy whoosh when a guide arrives. */
      whoosh() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const ctx = this.ctx, t = ctx.currentTime, dur = 0.45;
        const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.2;
        filter.frequency.setValueAtTime(350, t);
        filter.frequency.exponentialRampToValueAtTime(1800, t + dur);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start(t);
        src.stop(t + dur);
      },
      /** Happy rising arpeggio for a right answer. */
      cheer() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          const t0 = t + i * 0.1;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (i === 3 ? 0.7 : 0.25));
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.8);
        });
      },
      /** Soft, friendly "try again" boop (never a buzzer). */
      boop() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(380, t);
        osc.frequency.exponentialRampToValueAtTime(290, t + 0.18);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.1, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      },
      /** Soft two-note chime. */
      ding() {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const t = this.ctx.currentTime;
        [[880, 0], [1318.5, 0.09]].forEach(([freq, delay]) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t + delay);
          gain.gain.exponentialRampToValueAtTime(0.22, t + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.9);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + 1);
        });
      },
    };
    window.addEventListener("pointerdown", () => Sound.unlock(), { capture: true });
    window.addEventListener("keydown", () => Sound.unlock(), { capture: true });

    // --- ⚙️ Settings panel ---
    const settingsBtn = document.getElementById("btn-settings");
    const settingsPanel = document.getElementById("settings-panel");
    function openSettings(open) {
      settingsPanel.hidden = !open;

    }, { capture: true });

    const soundBtn = document.getElementById("btn-sound");

    // --- ▶ / ⏸ between the Moon arrows, and the 🐢 🚲 🚀 Moon speed in ⚙️ ---
    const playBtn = document.getElementById("btn-play");
    function showPlayState() {

    const speedBtns = [...document.querySelectorAll(".speed-choices button")];

    }));

    const lerp = THREE.MathUtils.lerp;

    /* ---------- "See the real sizes!" ----------
       Smoothly switches to true relative sizes and distances: Earth shrinks to a
       small ball, the Moon to a tiny dot 60 Earth-radii away, and the Sun grows
       into a giant glowing edge at the side (its distance is squeezed to fit).
       Snapping and lessons pause until the friendly view comes back. */
    const realScale = { on: false, mix: 0, conesBefore: false, raysBefore: false, sunsetBefore: false };
    const scaleBtn = document.getElementById("btn-scale");
    const sunFarLabel = document.getElementById("sun-far-label");
    const smoothMix = (t) => t * t * (3 - 2 * t);
    const NORMAL_TARGET_X = CONFIG.camera.target.x;

    /** Apply a blend between the friendly view (0) and real sizes (1). */
    function applyScaleMix(m) {
      const R = CONFIG.realScale;
      sizes.earthRadius = lerp(CONFIG.earth.radius, R.earthRadius, m);
      sizes.moonRadius = lerp(CONFIG.moon.radius, R.moonRadius, m);
      sizes.orbitRadius = lerp(CONFIG.moon.orbitRadius, R.orbitRadius, m);
      earth.scale.setScalar(sizes.earthRadius / CONFIG.earth.radius);
      const moonScale = sizes.moonRadius / CONFIG.moon.radius;
      moon.scale.setScalar(moonScale);
      moonHit.scale.setScalar(lerp(1, 0.6, m) / moonScale); // the tiny Moon stays easy to grab
      orbitDots.scale.setScalar(sizes.orbitRadius / CONFIG.moon.orbitRadius);
      placeMoon(state.moonAngle);
      // Sun: keep its right edge where it was and let it grow huge to the left.
      const sunR = lerp(CONFIG.sun.radius, R.sunRadius, m);
      sun.scale.setScalar(sunR / CONFIG.sun.radius);
      sun.position.x = CONFIG.sun.position.x + CONFIG.sun.radius - sunR;
      // Shadow box must still cover the (wider) Moon orbit.
      const cam = sunLight.shadow.camera;
      const half = Math.max(CONFIG.shadows.halfSize, sizes.orbitRadius + 1.5);
      cam.left = -half; cam.right = half; cam.top = half; cam.bottom = -half;
      const d = CONFIG.sun.position.distanceTo(CONFIG.earth.position);
      cam.near = Math.max(0.5, d - sizes.orbitRadius - 2);
      cam.far = d + sizes.orbitRadius + 2;
      cam.updateProjectionMatrix();
      // The Moon's shadow painted on Earth shrinks with the Moon (real umbra ≈ a dot, penumbra ≈ 2 Moon-widths).
      moonShadowUniforms.uMoonShadow.value.set(
        lerp(CONFIG.moonShadow.umbraRadius, R.moonRadius * 0.15, m),
        lerp(CONFIG.moonShadow.penumbraRadius, R.moonRadius * 2.2, m));
    }

    function updateRealScale(dt) {
      const want = realScale.on ? 1 : 0;
      if (realScale.mix === want) return;
      const step = CONFIG.reducedMotion ? 1 : dt / CONFIG.realScale.seconds;
      realScale.mix = want > realScale.mix ? Math.min(1, realScale.mix + step) : Math.max(0, realScale.mix - step);
      applyScaleMix(smoothMix(realScale.mix));
      sunFarLabel.classList.toggle("show", realScale.mix > 0.85);
      if (realScale.mix > 0.85) showRealLabels(); else clearRealLabels();
    }
    const sunGlowFactor = () => lerp(1, 0.45, smoothMix(realScale.mix)); // a huge glow would hide everything

    function setRealScale(on, { resume = true } = {}) {
      if (realScale.on === on || ground.open) return;
      realScale.on = on;
      interactionRules.snapEnabled = !on;
      if (on) {
        realScale.conesBefore = state.conesOn;
        realScale.raysBefore = raysOn;
        realScale.sunsetBefore = sunsetOn;
        setShadowCones(false);
        setLightRays(false);
        setSunsetLight(false);       // the sunset-light drawing is made for the friendly sizes
      } else {
        if (realScale.conesBefore) setShadowCones(true);
        if (realScale.raysBefore) setLightRays(true);
        if (realScale.sunsetBefore) setSunsetLight(true);
      }
      sunsetBtn.disabled = on;
      updateAlignment(); // let go of any snapped line-up
      conesBtn.disabled = on;
      scaleBtn.setAttribute("aria-pressed", String(on));
      document.getElementById("scale-label").textContent = on ? "Back to the friendly view" : "See the real sizes!";
      document.getElementById("scale-note").textContent = on ? "Real sizes!" : "Not to scale";
      scaleBtn.setAttribute("aria-label", on ? "Back to the friendly view" : "See the real sizes");
      CONFIG.camera.target.x = on ? CONFIG.realScale.cameraTargetX : NORMAL_TARGET_X;
      resetView();
      emit("realscale", { on });
      if (on) {
        Guides.say(SCRIPTS.realSizes, { tag: "scale" });
      } else {
        if (Guides.tag === "scale") Guides.hide();
        if (resume && lesson.active) runStep(); // pick the lesson up again
      }
    }
    scaleBtn.addEventListener("click", () => setRealScale(!realScale.on));

    // Small labels pointing at the tiny Earth and Moon (same style as the chapter-1 facts).
    function showRealLabels() {
      if (factLabels.has("earth-real")) return;
      [["earth-real", "🌍 Earth"], ["moon-real", "🌙 Moon"]].forEach(([key, text]) => {
        const el = document.createElement("div");
        el.className = "fact-label real-label" + (key === "earth-real" ? " below" : "");
        el.textContent = text;
        labelsEl.appendChild(el);
        factLabels.set(key, el);
      });
    }
    function clearRealLabels() {
      ["earth-real", "moon-real"].forEach((k) => { const el = factLabels.get(k); if (el) { el.remove(); factLabels.delete(k); } });
    }

    // --- Shadow cones toggle ---
    const conesBtn = document.getElementById("btn-cones");
    conesBtn.addEventListener("click", () => setShadowCones(!state.conesOn));
    events.addEventListener("cones", (e) => conesBtn.setAttribute("aria-pressed", String(e.detail.on)));

    // --- 🪐 Tilted path toggle (remembered; off by default) ---
    const tiltBtn = document.getElementById("btn-tilt");
    function showTiltState() {
      tiltBtn.setAttribute("aria-pressed", String(orbitTilt.on));
      document.getElementById("tilt-sub").textContent = orbitTilt.on
        ? "On: eclipses only on some laps, like the real Moon" : "Off: an eclipse on every lap";
    }
    tiltBtn.addEventListener("click", () => setOrbitTilt(!orbitTilt.on));
    events.addEventListener("orbittilt", showTiltState);
    showTiltState();

    // --- 🌅 Sunset light toggle ---
    const sunsetBtn = document.getElementById("btn-sunset");
    sunsetBtn.addEventListener("click", () => setSunsetLight(!sunsetOn));
    events.addEventListener("sunsetlight", (e) => sunsetBtn.setAttribute("aria-pressed", String(e.detail.on)));

    /* ---------- Ground view ----------
       What people standing on Earth see. Solar: the Moon's dark disc slides over
       the Sun (the Moon can't be seen in the bright daytime sky, only where it
       covers the Sun), the sky turns to dusk, stars come out, the corona glows. Lunar: at
       night, Earth's shadow slides over the full Moon and it turns coppery red.
       Events: "groundview" { type, open }, "groundphase" { type, phase }
       phases: "safety" (Kai's safety talk) → "playing" → "total" → "done"
       Tapping the small 🌍 frame opens it. With the Moon snapped into a line-up it plays that eclipse
       (type "solar" / "lunar"). Otherwise it opens "live": the small frame's picture, full screen,
       still following the Moon as it travels. */
    const GROUND = {
      sun:  { x: 900, y: 250, r: 90 },
      moon: { x: 900, y: 240, r: 80 },   // lunar view
      umbraR: 210,                       // Earth's dark inner shadow is about 2.6 times as wide as the Moon
      umbraEdge: 0.57,                   // where the umbra ends inside the shadow gradient (the rest is penumbra)
      moonSize: 1.04,                    // in a total solar eclipse the Moon looks a little bigger than the Sun
      timing: { in: 4.5, hold: 3.5, out: 4 },
      sky: {
        day:   ["#3aa0ff", "#8fd0ff", "#d6f1ff"],
        dusk:  ["#0d1238", "#2a2463", "#ff9a62"], // totality: a sunset glow all around the horizon
        night: ["#070723", "#1a1650", "#33285e"],
      },
      city: {
        groundY: 770,
        quietZone: { x: 900, halfWidth: 270, maxTop: 430 }, // keep buildings below the Sun and Moon
        buildingDay: ["#8fa3c7", "#a7b6d6", "#7b8fb8", "#b9c4dd", "#9c93c9"],
        buildingNight: ["#1b2142", "#20264a", "#181d3c", "#232a50", "#1f1f45"],
        litAtNight: 0.65, // share of windows with the lights on
      },
    };
    const groundEl = document.getElementById("ground");
    const $g = (id) => document.getElementById(id);
    const ground = { open: false, type: null, phase: "idle", t: 0, totalAnnounced: false,
                     liveNight: 1, liveSafetyDone: false, resumePlay: false };
    let groundCoveredAt = Infinity; // when the ground view fully covers the 3D scene

    // Stars for the ground sky (fixed pattern)
    {
      const rand = seededRandom(99);
      const ns = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 90; i++) {
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", (rand() * 1600).toFixed(0));
        c.setAttribute("cy", (rand() * 520).toFixed(0));
        c.setAttribute("r", (1.4 + rand() * 2.4).toFixed(1));
        c.setAttribute("fill", rand() > 0.8 ? "#fff3c4" : "#ffffff");
        $g("ground-stars").appendChild(c);
      }
    }

    function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`;
    }
    const smooth = (e0, e1, x) => { const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

    /** Fraction of a disc (radius rs) hidden by another disc (radius rm) whose centre is d away. */
    function discCover(d, rs, rm) {
      if (d >= rs + rm) return 0;
      if (d <= Math.abs(rm - rs)) return rm >= rs ? 1 : (rm * rm) / (rs * rs);
      const a = rs * rs * Math.acos((d * d + rs * rs - rm * rm) / (2 * d * rs))
        + rm * rm * Math.acos((d * d + rm * rm - rs * rs) / (2 * d * rm))
        - 0.5 * Math.sqrt((-d + rs + rm) * (d + rs - rm) * (d - rs + rm) * (d + rs + rm));
      return a / (Math.PI * rs * rs);
    }

    /** How the daytime sky looks when the Moon's centre is d away from the Sun's centre (Sun radius rs, Moon rm). */
    function solarLook(d, rs, rm) {
      const coverage = discCover(d, rs, rm);
      const sliver = d - (rm - rs);                                    // how much Sun still peeks out (≤ 0: totality)
      const total = sliver <= 0;
      const lastMoments = 1 - smooth(0, 0.16 * rs, Math.max(0, sliver)); // 0 → 1 as the last sliver shrinks away
      return {
        coverage, total,
        dark: smooth(0.7, 1, coverage),               // daylight looks normal until most of the Sun is hidden
        corona: lastMoments,                          // the corona appears together with the diamond ring
        diamond: total ? 0 : lastMoments,             // the last (or first) sparkle of sunlight; gone in totality
        glow: 1 - 0.95 * smooth(0.6, 1, coverage),
        planets: smooth(0.9, 1, coverage),            // bright planets and only the brightest stars:
        stars: 0.3 * smooth(0.92, 1, coverage),       // totality is as dark as twilight, not as dark as night
      };
    }

    /** Where the Moon is for the two sky pictures. `toward`: +1 = straight behind Earth (full Moon), −1 = straight
        toward the Sun (new Moon). `side` / `up`: how far it sits from the Sun–Earth line (the tilted path carries
        it above and below). `off` is that distance, `sx` / `sy` its direction. */
    function moonInSky() {
      const p = moon.position, side = -p.z, up = p.y, off = Math.hypot(side, up);
      return { toward: p.x / sizes.orbitRadius, side, up, off, sx: off ? side / off : 0, sy: off ? up / off : 0 };
    }

    /** How far apart the Moon and Sun look (in Sun radii, signed) for people in the middle of Earth's sunny side,
        when the Moon sits `lateral` away from the Sun–Earth line. Tied to the shadow in the space view: the discs
        first touch as the faint outer shadow reaches those people, and totality is while the dark spot covers them. */
    function sunMoonGap(lateral) {
      const U = CONFIG.moonShadow.umbraRadius, P = CONFIG.moonShadow.penumbraRadius, m = GROUND.moonSize;
      const L = Math.abs(lateral);
      const gap = L <= U ? (L / U) * (m - 1) : (m - 1) + ((L - U) / (P - U)) * 2;
      return Math.sign(lateral) * gap;
    }

    /** Offset of the moving disc over time: slide in, hold in the middle, slide out. */
    function slideOffset(t, dist) {
      const T = GROUND.timing;
      if (t < T.in) return -dist * (1 - smooth(0, 1, t / T.in));
      if (t < T.in + T.hold) return 0;
      return dist * smooth(0, 1, (t - T.in - T.hold) / T.out);
    }
    const groundDuration = () => GROUND.timing.in + GROUND.timing.hold + GROUND.timing.out;

    // --- Where are we watching from? Countryside or city ---
    const SCENE_KEY = "eclipse-explorer.groundScene";
    let groundScene = "country";
    try { if (localStorage.getItem(SCENE_KEY) === "city") groundScene = "city"; } catch { /* storage blocked: fine */ }

    /** City skyline: skyscrapers with window grids. Short buildings in the middle so the Sun and Moon stay visible. */
    function buildCity() {
      const C = GROUND.city;
      const ns = "http://www.w3.org/2000/svg";
      const root = $g("land-city");
      const el = (tag, attrs, parent = root) => {
        const n = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        parent.appendChild(n);
        return n;
      };
      const rand = seededRandom(2024);
      // All windows share two groups (lights on / lights off at night), so darkening repaints 2 shapes, not hundreds.
      const buildings = el("g", {});
      const winsLit = el("g", { "data-day": "#d8ecff", "data-night": "#ffd166" });
      const winsDark = el("g", { "data-day": "#d8ecff", "data-night": "#2b3260" });
      let tallest = null;
      for (let x = -20, i = 0; x < 1620; i++) {
        const w = 90 + Math.floor(rand() * 80);
        const centre = x + w / 2;
        const inQuietZone = Math.abs(centre - C.quietZone.x) < C.quietZone.halfWidth;
        const top = inQuietZone
          ? C.quietZone.maxTop + rand() * 120
          : 150 + rand() * 320;
        const h = C.groundY - top;
        const c = i % C.buildingDay.length;
        el("rect", { x, y: top, width: w, height: h + 2, rx: 4, "data-day": C.buildingDay[c], "data-night": C.buildingNight[c] }, buildings);
        if (!tallest || top < tallest.top) tallest = { x, w, top };
        // Window grid
        const cols = Math.max(2, Math.floor((w - 20) / 30));
        const gap = (w - cols * 16) / (cols + 1);
        for (let wy = top + 22; wy < C.groundY - 40; wy += 38) {
          for (let k = 0; k < cols; k++) {
            el("rect", { x: (x + gap + k * (16 + gap)).toFixed(1), y: wy.toFixed(0), width: 16, height: 22, rx: 2 },
              rand() < C.litAtNight ? winsLit : winsDark);
          }
        }
        x += w + 6 + Math.floor(rand() * 12);
      }
      // Antenna with a red light on the tallest tower
      el("rect", { x: tallest.x + tallest.w / 2 - 3, y: tallest.top - 60, width: 6, height: 60, "data-day": "#6b7aa3", "data-night": "#141834" });
      el("circle", { cx: tallest.x + tallest.w / 2, cy: tallest.top - 62, r: 7, "data-day": "#ff6b6b", "data-night": "#ff3b3b" });
      // Sidewalk, road and lane markings
      el("rect", { x: 0, y: C.groundY, width: 1600, height: 24, "data-day": "#c9ccd6", "data-night": "#2a2d45" });
      el("rect", { x: 0, y: C.groundY + 24, width: 1600, height: 140, "data-day": "#5b5f73", "data-night": "#141628" });
      const lanes = el("g", { "data-day": "#f5f5f5", "data-night": "#3a3d55" });
      for (let lx = 20; lx < 1600; lx += 120) el("rect", { x: lx, y: C.groundY + 82, width: 60, height: 10, rx: 5 }, lanes);
    }
    buildCity();

    let lastLandPaint = { scene: null, darkness: -1 };
    /** Blend every landscape shape between its day and night colour. */
    function paintLand(darkness) {
      if (lastLandPaint.scene === groundScene && Math.abs(lastLandPaint.darkness - darkness) < 0.004) return;
      lastLandPaint = { scene: groundScene, darkness };
      $g(groundScene === "city" ? "land-city" : "land-country")
        .querySelectorAll("[data-day]")
        .forEach((n) => n.setAttribute("fill", mixHex(n.dataset.day, n.dataset.night, darkness)));
    }

    function setGroundScene(scene) {
      groundScene = scene === "city" ? "city" : "country";
      try { localStorage.setItem(SCENE_KEY, groundScene); } catch { /* fine without it */ }
      $g("land-country").style.display = groundScene === "country" ? "" : "none";
      $g("land-city").style.display = groundScene === "city" ? "" : "none";
      document.querySelectorAll("#scene-switch button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.scene === groundScene)));
      lastLandPaint.scene = null; // force a repaint
      if (ground.open) renderGround();
      emit("groundscene", { scene: groundScene });
    }
    document.querySelectorAll("#scene-switch button").forEach((b) =>
      b.addEventListener("click", () => setGroundScene(b.dataset.scene)));
    setGroundScene(groundScene); // apply the remembered choice
    function paintSky(from, to, t) {
      ["top", "mid", "bottom"].forEach((k, i) => $g(`g-sky-${k}`).setAttribute("stop-color", mixHex(from[i], to[i], t)));
    }

    /** Draw the daytime sky with the Moon's centre at (mx, my). Returns solarLook(). */
    function drawSolarSky(mx, my) {
      const S = GROUND.sun, d = Math.hypot(mx - S.x, my - S.y);
      const look = solarLook(d, S.r, S.r * GROUND.moonSize);
      $g("smoon-disc").setAttribute("cx", mx.toFixed(1));
      $g("smoon-disc").setAttribute("cy", my.toFixed(1));
      // In daylight the Moon only shows on the Sun. In totality the whole black Moon stands out against the corona.
      $g("clip-sun-circle").setAttribute("r", (S.r + 1.5 + 3 * look.corona).toFixed(1));
      $g("sun-corona").setAttribute("opacity", look.corona.toFixed(3));
      $g("sun-glow").setAttribute("opacity", look.glow.toFixed(3));
      $g("ground-planets").setAttribute("opacity", look.planets.toFixed(3));
      $g("sun-diamond").setAttribute("opacity", look.diamond.toFixed(3));
      if (look.diamond > 0.005 && d > 0) {
        // The sparkle sits on the Sun's edge, on the side the Moon has not covered yet.
        const ux = (S.x - mx) / d, uy = (S.y - my) / d;
        $g("sun-diamond").setAttribute("transform",
          `translate(${(S.x + ux * S.r).toFixed(1)} ${(S.y + uy * S.r).toFixed(1)}) rotate(${(Math.atan2(uy, ux) * 180 / Math.PI).toFixed(1)})`);
      }
      return look;
    }

    /** Draw Earth's shadow on the Moon: shadow centre at (ux, uy) from the Moon's centre, `red` = 0..1 copper glow. */
    function drawLunarSky(ux, uy, umbraR, red) {
      const M = GROUND.moon;
      $g("lmoon-umbra").setAttribute("cx", (M.x + ux).toFixed(1));
      $g("lmoon-umbra").setAttribute("cy", (M.y + uy).toFixed(1));
      $g("lmoon-umbra").setAttribute("r", (umbraR / GROUND.umbraEdge).toFixed(1));
      $g("lmoon-red").setAttribute("opacity", red.toFixed(3));
      $g("lmoon-redhalo").setAttribute("opacity", (0.14 * red).toFixed(3)); // barely a glow: a red Moon is dim, it doesn't shine
      // More sunlight is bent into the outer part of the shadow, so the side of the Moon nearest the
      // shadow's edge is brighter and more orange; right in the middle the Moon is an even, deep red.
      const off = Math.hypot(ux, uy);
      const nearEdge = THREE.MathUtils.clamp(off / Math.max(1, umbraR - M.r), 0, 1);
      $g("lmoon-rim").setAttribute("cx", (M.x - (off ? ux / off : 0) * M.r * 0.8).toFixed(1));
      $g("lmoon-rim").setAttribute("cy", (M.y - (off ? uy / off : 0) * M.r * 0.8).toFixed(1));
      $g("lmoon-rim").setAttribute("opacity", (red * smooth(0.2, 1, nearEdge)).toFixed(3));
    }

    /** Live full-screen sky: the small frame's picture, big. Same maths as updateEarthFrame(), so the two always agree. */
    function renderGroundLive() {
      const S = GROUND.sun, M = GROUND.moon, sky = moonInSky();
      const farSide = sky.toward > 0;
      const night = smooth(-0.17, 0.17, sky.toward);
      ground.liveNight = night; // the safety talk starts as soon as the Sun is up (see liveSafetyCheck)

      // Day: the Sun, and the Moon only where it covers the Sun. (Up in space is up in the sky.)
      const gap = farSide ? 6 : Math.min(6, sunMoonGap(sky.off));
      const look = drawSolarSky(S.x + sky.sx * gap * S.r, S.y - sky.sy * gap * S.r);
      $g("solar-sky").setAttribute("opacity", (1 - night).toFixed(3));

      // Night: the Moon with its unlit part dark, Earth's shadow sliding over it, and the same red as in space.
      const { x, y, r } = M;
      const lit = Math.max(0, sky.toward);
      const rx = (r * lit).toFixed(2), o = sky.side < 0 ? 0 : 1; // unlit on the left or the right
      $g("lmoon-dark").setAttribute("d", `M${x} ${y - r}A${r} ${r} 0 0 ${o} ${x} ${y + r}A${rx} ${r} 0 0 ${1 - o} ${x} ${y - r}Z`);
      const umbraR = (sizes.earthRadius / sizes.moonRadius) * r;
      // Earth's shadow stays on the Sun–Earth line, so a Moon above the line sees the shadow below it.
      const toSky = r / sizes.moonRadius, far = 1300;
      const ux = farSide ? THREE.MathUtils.clamp(sky.side * toSky, -far, far) : far;
      const uy = farSide ? THREE.MathUtils.clamp(sky.up * toSky, -far, far) : 0;
      drawLunarSky(ux, uy, umbraR, farSide ? state.redness : 0);
      $g("lmoon-halo").setAttribute("opacity", ((0.5 + 0.5 * lit) * (1 - 0.9 * moonShadowDepth())).toFixed(3));
      $g("lunar-sky").setAttribute("opacity", night.toFixed(3));

      ["top", "mid", "bottom"].forEach((k, i) => $g(`g-sky-${k}`).setAttribute("stop-color", frameSky(i, look.dark, night)));
      paintLand(Math.max(look.dark, night));
      $g("ground-stars").setAttribute("opacity", Math.max(night, look.stars).toFixed(3));
      groundEl.style.background = frameSky(0, look.dark, night);
      $g("ground-sun-tip").hidden = night > 0.5; // the reminder shows whenever the Sun is in the sky
      return false;
    }

    function renderGround() {
      if (ground.type === "live") return renderGroundLive();
      const t = ground.t;
      if (ground.type === "solar") {
        const S = GROUND.sun;
        // The Moon crosses from right to left, the same way it travels in the space view and the small frame.
        const dx = -slideOffset(t, S.r * 3.4);
        const look = drawSolarSky(S.x + dx, S.y - dx * 0.12);
        paintSky(GROUND.sky.day, GROUND.sky.dusk, look.dark);
        paintLand(look.dark);
        $g("ground-stars").setAttribute("opacity", look.stars.toFixed(3));
        groundEl.style.background = mixHex(GROUND.sky.day[0], GROUND.sky.dusk[0], look.dark);
        return look.total;
      } else {
        const M = GROUND.moon, R = GROUND.umbraR;
        const dx = slideOffset(t, R + M.r + 60);
        const dist = Math.hypot(dx, dx * 0.1);
        // Inside the umbra the Moon first looks almost black next to its bright part; the copper red
        // shows once the whole Moon is in the shadow.
        const red = smooth(R - M.r + 40, R - M.r, dist);
        const covered = smooth(R + M.r, R - M.r, dist);
        drawLunarSky(dx, dx * 0.1, R, red);
        $g("lmoon-halo").setAttribute("opacity", (1 - 0.9 * covered).toFixed(3));
        paintSky(GROUND.sky.night, GROUND.sky.night, 0);
        paintLand(1);
        $g("ground-stars").setAttribute("opacity", (0.75 + 0.25 * covered).toFixed(3));
        groundEl.style.background = GROUND.sky.night[0];
        return red > 0.98;
      }
    }

    function setGroundPhase(phase) {
      ground.phase = phase;
      emit("groundphase", { type: ground.type, phase });
      $g("btn-replay").hidden = phase !== "done";
    }

    function startGroundAnimation() {
      ground.t = 0;
      ground.totalAnnounced = false;
      $g("ground-top").hidden = false;
      setGroundPhase("playing");
    }

    function openGroundView(type) {
      if (ground.open) return;
      ground.open = true;
      ground.type = type;
      ground.t = 0;
      ground.liveSafetyDone = false;
      ground.liveNight = 1;
      const live = type === "live";
      $g("solar-sky").style.display = type === "lunar" ? "none" : "";
      $g("lunar-sky").style.display = type === "solar" ? "none" : "";
      // The eclipse shows start from a clean sky (the live view moves these around).
      $g("solar-sky").setAttribute("opacity", 1);
      $g("lunar-sky").setAttribute("opacity", 1);
      $g("lmoon-dark").setAttribute("d", "");
      $g("ground-planets").setAttribute("opacity", 0);
      $g("sun-diamond").setAttribute("opacity", 0);
      $g("ground-sun-tip").hidden = true;
      renderGround();
      document.body.classList.add("ground-open");
      groundEl.classList.add("open");
      groundCoveredAt = performance.now() + (CONFIG.reducedMotion ? 0 : 550); // after the fade-in
      groundEl.setAttribute("aria-hidden", "false");
      emit("groundview", { type, open: true });

      if (live) {
        $g("ground-top").hidden = false;
        Guides.hide();
        setGroundPhase("live");
        liveSafetyCheck(); // daytime right away? then the safety talk comes first
      } else if (type === "solar") {
        // Safety first: Kai's warning (its Next is locked for 2 seconds), and the
        // eclipse only plays once the child has gone through the whole safety talk.
        $g("ground-top").hidden = true;
        setGroundPhase("safety");
        Guides.say(SCRIPTS.solarSafety, { tag: "safety" }).then(() => {
          if (ground.open && ground.phase === "safety") startGroundAnimation();
        });
      } else {
        $g("ground-top").hidden = false;
        startGroundAnimation();
        Guides.say(SCRIPTS.lunarSafe, { tag: "ground" });
      }
    }

    function closeGroundView() {
      if (!ground.open || ground.phase === "safety") return;
      ground.open = false;
      ground.phase = "idle";
      groundEl.classList.remove("open");
      document.body.classList.remove("ground-open");
      groundEl.setAttribute("aria-hidden", "true");
      Guides.hide();
      clock.getDelta(); // don't let the 3D scene jump after a long pause
      emit("groundview", { type: ground.type, open: false });
    }

    /** Called every frame while the ground view is open. */
    /* Safety first in the live view too: the moment the Sun is in the sky, the Moon pauses and
       Kai gives the same locked safety talk as the eclipse show (Next locked for 2 s, Back to space
       hidden, can't be closed with ✕). It runs once each time the live view opens. */
    function liveSafetyCheck() {
      if (ground.phase !== "live" || ground.liveSafetyDone || ground.liveNight > 0.5) return;
      ground.liveSafetyDone = true;
      ground.resumePlay = autoplay.on;
      setAutoplay(false);                 // no eclipse can sneak past while Kai is talking
      $g("ground-top").hidden = true;
      setGroundPhase("safety");
      Guides.say(SCRIPTS.liveSafety, { tag: "safety" }).then(() => {
        if (!ground.open || ground.type !== "live") return;
        $g("ground-top").hidden = false;
        setGroundPhase("live");
        if (ground.resumePlay) setAutoplay(true);
      });
    }

    function updateGround(dt) {
      if (ground.type === "live") { renderGround(); liveSafetyCheck(); return; }
      if (ground.phase !== "playing" && ground.phase !== "total") return;
      ground.t = Math.min(groundDuration(), ground.t + dt);
      const total = renderGround();
      if (total && !ground.totalAnnounced) { ground.totalAnnounced = true; setGroundPhase("total"); }
      if (ground.t >= groundDuration()) setGroundPhase("done");
    }

    $g("btn-back-space").addEventListener("click", closeGroundView);
    $g("btn-replay").addEventListener("click", startGroundAnimation);
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeGroundView(); });

    /* ---------- 🌍 View-from-Earth frame ----------
       A small live picture of the sky, always showing what the space view shows:
       - Moon on the Sun's side → daytime, looking at the Sun. The Moon is invisible in the bright sky
         and only shows where it covers the Sun (a solar eclipse begins when its shadow reaches Earth).
       - Moon on the far side → night, looking at the Moon with its sunny part lit (half → full).
         Earth's shadow slides over it and it turns red exactly like the Moon in space.
       Tapping it opens the view full screen: the eclipse show if the Moon is snapped into a line-up,
       otherwise the same live picture, big.
       ⚙️ → "View from Earth" shows or hides it (remembered). */
    const FRAME_KEY = "eclipse-explorer.earthFrame";
    const EF = { cx: 120, cy: 56, r: 24, land: ["#6fcf7a", "#1b2445"] };
    const earthFrame = { el: $g("earth-frame"), on: true, key: "", status: "" };
    try { earthFrame.on = localStorage.getItem(FRAME_KEY) !== "0"; } catch { /* storage blocked: fine */ }
    const frameBtn = $g("btn-earth-frame");
    function setEarthFrame(on) {
      earthFrame.on = Boolean(on);
      earthFrame.el.hidden = !earthFrame.on;
      earthFrame.key = ""; // draw it fresh when it comes back
      frameBtn.setAttribute("aria-pressed", String(earthFrame.on));
      try { localStorage.setItem(FRAME_KEY, earthFrame.on ? "1" : "0"); } catch { /* fine */ }
      emit("earthframe", { on: earthFrame.on });
    }
    frameBtn.addEventListener("click", () => setEarthFrame(!earthFrame.on));
    earthFrame.el.addEventListener("click", () => openGroundView(state.aligned || "live"));
    setEarthFrame(earthFrame.on);
    {
      const rand = seededRandom(31);
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", (rand() * 240).toFixed(0));
        c.setAttribute("cy", (rand() * 100).toFixed(0));
        c.setAttribute("r", (0.5 + rand() * 0.9).toFixed(1));
        c.setAttribute("fill", "#ffffff");
        $g("ef-stars").appendChild(c);
      }
    }
    /** Blend day → dusk (eclipse) → night for one sky colour. */
    function frameSky(i, dark, night) {
      const S = GROUND.sky, day = hexToRgb(S.day[i]), dusk = hexToRgb(S.dusk[i]), nite = hexToRgb(S.night[i]);
      return `rgb(${day.map((v, k) => Math.round(lerp(lerp(v, dusk[k], dark), nite[k], night))).join(",")})`;
    }
    function updateEarthFrame() {
      if (!earthFrame.on || ground.open) return;
      const key = `${state.moonAngle.toFixed(4)}|${state.redness.toFixed(3)}|${orbitTilt.node.toFixed(4)}|${orbitTilt.amount.toFixed(3)}`;
      if (key === earthFrame.key) return; // nothing moved: leave the picture alone
      earthFrame.key = key;
      const { cx, cy, r } = EF, sky = moonInSky();
      const farSide = sky.toward > 0;                       // Moon behind Earth, away from the Sun
      const night = smooth(-0.17, 0.17, sky.toward);        // 0 = daytime picture, 1 = night picture

      // Day: the Moon only shows where it covers the Sun (see sunMoonGap for how this is tied to the space view).
      const gap = farSide ? 6 : Math.min(6, sunMoonGap(sky.off));
      const look = solarLook(gap * r, r, r * GROUND.moonSize);
      const coverage = look.coverage, dark = look.dark;
      $g("ef-newmoon").setAttribute("cx", (cx + sky.sx * gap * r).toFixed(1));
      $g("ef-newmoon").setAttribute("cy", (cy - sky.sy * gap * r).toFixed(1));
      $g("ef-corona").setAttribute("opacity", look.corona.toFixed(3));
      $g("ef-sunglow-c").setAttribute("opacity", look.glow.toFixed(3));
      $g("ef-planet").setAttribute("opacity", look.planets.toFixed(3));
      $g("ef-diamond").setAttribute("opacity", look.diamond.toFixed(3));
      $g("ef-diamond").setAttribute("cx", (cx - sky.sx * r).toFixed(1)); // on the side not covered yet
      $g("ef-diamond").setAttribute("cy", (cy + sky.sy * r).toFixed(1));
      $g("ef-day").setAttribute("opacity", (1 - night).toFixed(3));

      // Night: the sunny part of the Moon faces the Sun; Earth's shadow is 'earthRadius' wide on the same scale.
      const rx = (r * Math.max(0, sky.toward)).toFixed(2), f = sky.side < 0 ? 1 : 0; // lit on the right or the left
      $g("ef-lit").setAttribute("d", `M${cx} ${cy - r}A${r} ${r} 0 0 ${f} ${cx} ${cy + r}A${rx} ${r} 0 0 ${f} ${cx} ${cy - r}Z`);
      const toSky = r / sizes.moonRadius;
      $g("ef-umbra").setAttribute("cx", (farSide ? THREE.MathUtils.clamp(cx + sky.side * toSky, -300, 540) : 540).toFixed(1));
      $g("ef-umbra").setAttribute("cy", (farSide ? THREE.MathUtils.clamp(cy + sky.up * toSky, -300, 400) : cy).toFixed(1));
      $g("ef-umbra").setAttribute("r", (((sizes.earthRadius / sizes.moonRadius) * r) / GROUND.umbraEdge).toFixed(1));
      $g("ef-red").setAttribute("opacity", (farSide ? state.redness : 0).toFixed(3));
      $g("ef-night").setAttribute("opacity", night.toFixed(3));

      $g("ef-stars").setAttribute("opacity", Math.max(night, look.stars).toFixed(3));
      $g("ef-sky-top").setAttribute("stop-color", frameSky(0, dark, night));
      $g("ef-sky-bottom").setAttribute("stop-color", frameSky(2, dark, night));
      $g("ef-land").setAttribute("fill", mixHex(EF.land[0], EF.land[1], Math.max(dark, night)));

      const inShadow = farSide && moonShadowDepth() > 0;
      const status = coverage > 0 ? "Solar eclipse! 🌑" : inShadow ? "Lunar eclipse! 🌕" : night > 0.5 ? "Night-time 🌙" : "Daytime ☀️";
      if (status !== earthFrame.status) { earthFrame.status = status; $g("ef-status").textContent = status; }
    }

    let cameraTween = null; // { fromDir, fromDist, turn, toDist, fromTarget, t }
    let cameraIsHome = true; // false once the child moves the camera themselves
    const tweenTurn = new THREE.Quaternion();

    /** Swing the camera around the scene (never straight through it) back to the home spot. */
    function resetView() {
      cameraIsHome = true;
      zoomGoal = null;
      const from = camera.position.clone().sub(controls.target);
      const to = homeCameraPosition().sub(CONFIG.camera.target);
      const fromDir = from.clone().normalize();
      cameraTween = {
        fromDir,
        fromDist: from.length(),
        turn: new THREE.Quaternion().setFromUnitVectors(fromDir, to.clone().normalize()),
        toDist: to.length(),
        fromTarget: controls.target.clone(),
        t: CONFIG.reducedMotion ? 1 : 0,
      };
    }

    /** The camera can fly all the way around and zoom in close, so nudge it back out if it would end up
        inside the Sun, Earth or the Moon. */
    const bodyGap = new THREE.Vector3();
    function keepCameraOut(centre, keepOut) {
      bodyGap.subVectors(camera.position, centre);
      if (bodyGap.length() >= keepOut) return;
      if (bodyGap.lengthSq() < 1e-6) bodyGap.subVectors(camera.position, controls.target); // dead centre: back away from the scene
      camera.position.copy(centre).addScaledVector(bodyGap.normalize(), keepOut);
      camera.lookAt(controls.target);
    }
    function keepCameraOutOfBodies() {
      keepCameraOut(sun.position, CONFIG.sun.radius * sun.scale.x * 1.15);
      keepCameraOut(earthSystem.position, CONFIG.earth.radius * 1.35);
      keepCameraOut(moonShadowUniforms.uMoonPos.value, CONFIG.moon.radius * 1.8); // the Moon's place in the scene
    }

    /* ---------- ＋ / − zoom buttons ----------
       Each tap glides the camera a step closer to, or further from, the middle of the scene
       (the same zoom as the mouse wheel or a two-finger pinch). */
    const zoomInBtn = document.getElementById("btn-zoom-in"), zoomOutBtn = document.getElementById("btn-zoom-out");
    const zoomOffset = new THREE.Vector3();
    let zoomGoal = null, zoomUntil = 0;
    function zoomBy(factor) {
      const from = zoomGoal ?? camera.position.distanceTo(controls.target);
      zoomGoal = THREE.MathUtils.clamp(from * factor, controls.minDistance, controls.maxDistance);
      zoomUntil = performance.now() + 900; // never fight a body the camera is not allowed inside for long
      cameraTween = null;
      cameraIsHome = false;
    }
    function updateZoom(dt) {
      const dist = zoomOffset.subVectors(camera.position, controls.target).length();
      if (zoomGoal !== null) {
        let next = dist + (zoomGoal - dist) * (CONFIG.reducedMotion ? 1 : 1 - Math.exp(-9 * dt));
        if (Math.abs(zoomGoal - next) < 0.03 || performance.now() > zoomUntil) { next = Math.abs(zoomGoal - next) < 0.03 ? zoomGoal : next; zoomGoal = null; }
        camera.position.copy(controls.target).addScaledVector(zoomOffset.normalize(), next);
      }
      // Grey out a button at the end of its range.
      const goal = zoomGoal ?? dist;
      zoomInBtn.disabled = goal <= controls.minDistance + 0.05;
      zoomOutBtn.disabled = goal >= controls.maxDistance - 0.05;
    }
    zoomInBtn.addEventListener("click", () => zoomBy(0.78));
    zoomOutBtn.addEventListener("click", () => zoomBy(1 / 0.78));
    document.getElementById("btn-reset-view").addEventListener("click", resetView);
    // Any manual camera move cancels a reset or zoom animation in progress.
    controls.addEventListener("start", () => { cameraTween = null; cameraIsHome = false; zoomGoal = null; });

    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return; // hidden tab / zero-size frame: keep the last good size
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      // Tall, narrow screens need to back further away to fit Sun, Earth and Moon.
      controls.maxDistance = Math.max(CONFIG.camera.maxDistance, fitDistance() * 1.25);
      // If the page started while hidden, the camera may never have been placed properly.
      // Rotating a tablet or resizing the window re-fits the view, unless the child moved it.
      const p = camera.position;
      if (cameraIsHome || !Number.isFinite(p.x + p.y + p.z) || p.lengthSq() === 0) {
        cameraTween = null;
        camera.position.copy(homeCameraPosition());
        controls.target.copy(CONFIG.camera.target);
      }
    }
    window.addEventListener("resize", onResize);
    onResize();
    camera.position.copy(homeCameraPosition());
    controls.update();

    // Tiny hook for testing from the browser console during development.
    window.__eclipse = {
      /** Jump the Moon straight to an angle (radians; PI = solar line-up, 0 = lunar). */
      setMoonAngle(a) { setRawAngle(a); state.moonAngle = state.targetAngle; placeMoon(state.moonAngle); },
      /** Push the Moon like a finger would (snapping applies). */
      pushMoon(a) { setRawAngle(a); },
      get state() { return { ...state }; },
      setShadowCones, openGroundView, closeGroundView,
      get ground() { return { ...ground }; },
      /** Jump the ground-view animation to a time in seconds (for checking frames). */
      seekGround(t) { ground.t = t; renderGround(); },
      setGroundScene,
      Guides, SCRIPTS, reactions, LESSONS, startChapter,
      get lesson() { return { ...lesson, completed: [...lesson.completed] }; },
      get freePlay() { return { ...freePlay }; },
      startFreePlay, resetProgress, saveProgress, setLearningMode, setRealScale,
      get realScale() { return { ...realScale }; },
      /** Testing aid: finish the real-sizes animation right away. */
      skipScaleAnimation() { updateRealScale(1e3); },
      get autoplay() { return { ...autoplay }; },
      get orbitTilt() { return { node: orbitTilt.node, settled: orbitTilt.settled, on: orbitTilt.on, amount: orbitTilt.amount }; },
      setOrbitTilt,
      setNode(n) { orbitTilt.node = n; orbitTilt.settled = false; tiltMoved = true; },
      setAutoplay, setMoonSpeed, setEarthFrame, resetView, setSunsetLight, zoomBy,
      get moonShadowInShader() { return moonShadowInShader; },
      get learning() { return { ...learning }; },
      get quality() { return { ...quality, pixelRatio: renderer.getPixelRatio(), shadowMap: sunLight.shadow.mapSize.x }; },
      tapBody(body) { emit("bodytap", { body }); },
      events,
      THREE, scene, camera, renderer, controls, homeCameraPosition,
    };

    /* =====================================================================
       MAIN LOOP
       ===================================================================== */
    const clock = new THREE.Clock();
    const easeInOut = (t) => t * t * (3 - 2 * t);

    /* Automatic quality: if frames are slow (below ~40 fps on average), step down
       the pixel ratio, then the shadow-map size. It never steps back up, so the
       picture doesn't flicker between levels. Aim: smooth on a mid-range tablet. */
    const quality = { level: 0, frames: 0, time: 0 };
    const QUALITY_LEVELS = [
      { maxPixelRatio: 2,   shadowMap: CONFIG.shadows.mapSize },
      { maxPixelRatio: 1.5, shadowMap: CONFIG.shadows.mapSize },
      { maxPixelRatio: 1,   shadowMap: 1024 },
    ];
    function applyQuality() {
      const q = QUALITY_LEVELS[quality.level];
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, q.maxPixelRatio));
      onResize();
      if (sunLight.shadow.mapSize.x !== q.shadowMap) {
        sunLight.shadow.mapSize.set(q.shadowMap, q.shadowMap);
        if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
      }
      emit("quality", { level: quality.level });
    }
    function watchPerformance(rawDt) {
      // Ignore pauses (hidden tab, ground view) and the first second after loading.
      if (document.hidden || rawDt > 0.25 || clock.elapsedTime < 1) return;
      quality.frames++;
      quality.time += rawDt;
      if (quality.frames < 120) return;
      const avg = quality.time / quality.frames;
      quality.frames = 0;
      quality.time = 0;
      if (avg > 1 / 40 && quality.level < QUALITY_LEVELS.length - 1) {
        quality.level++;
        applyQuality();
      }
    }

    function tick() {
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.1);
      const t = clock.elapsedTime;

      // While the ground view fully covers the screen, pause the 3D scene to save battery.
      // (In the live view the Moon keeps travelling, so the big sky keeps changing.)
      if (ground.open) {
        const covered = performance.now() >= groundCoveredAt;
        if (covered && ground.type === "live") { updateMoon(dt); updateEclipseEffects(dt); }
        updateGround(dt);
        if (covered) {
          requestAnimationFrame(tick);
          return;
        }
      }

      watchPerformance(rawDt);
      earth.rotation.y += dt * CONFIG.earth.spinSpeed;
      updateMoon(dt);
      updateEclipseEffects(dt);
      updateLightRays(dt);
      updateRealScale(dt);
      updateSunsetLight(dt);
      updateFactLabels();

      if (!CONFIG.reducedMotion) {
        sunGlow.scale.setScalar(CONFIG.sun.glowSize * sunGlowFactor() * (1 + Math.sin(t * 1.6) * 0.025));
      } else {
        sunGlow.scale.setScalar(CONFIG.sun.glowSize * sunGlowFactor());
      }

      if (cameraTween) {
        const c = cameraTween;
        c.t = Math.min(1, c.t + dt / 0.9);
        const k = easeInOut(c.t);
        controls.target.lerpVectors(c.fromTarget, CONFIG.camera.target, k);
        camera.position.copy(c.fromDir).applyQuaternion(tweenTurn.identity().slerp(c.turn, k))
          .multiplyScalar(lerp(c.fromDist, c.toDist, k)).add(controls.target);
        if (c.t >= 1) cameraTween = null;
      }

      updateZoom(dt);
      controls.update();
      keepCameraOutOfBodies();
      updateEarthFrame();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(() => {
      tick();
      window.__eclipseReady = true;
      document.getElementById("overlay").classList.add("hidden");
      setTimeout(startLessons, CONFIG.reducedMotion ? 0 : 700);
    });
  </script>
</body>
</html>
