<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eclipse Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --space-deep: #120b2e;
      --space-mid: #1e1650;
      --ui-bg: rgba(255, 255, 255, 0.92);
      --ui-text: #2a1f5c;
      --ui-accent: #ffb703;
      --ui-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      --tap: 56px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--space-deep);
      color: var(--ui-text);
      font-family: "Fredoka", "Baloo 2", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none; /* camera + (later) Moon dragging handle touch themselves */
    }

    /* ---------- UI: buttons ---------- */
    .btn {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 0 22px;
      border: none;
      border-radius: 999px;
      background: var(--ui-bg);
      color: var(--ui-text);
      font: 600 20px/1 "Fredoka", system-ui, sans-serif;
      box-shadow: var(--ui-shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.2s ease;
    }
    .btn:hover { background: #fff; }
    .btn:active { transform: scale(0.94); }
    .btn:focus-visible { outline: 4px solid var(--ui-accent); outline-offset: 3px; }

    #hud-bottom-right {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
    }

    #hud-bottom-center {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-arrow {
      width: 72px;
      height: 72px;
      padding: 0;
      font-size: 30px;
      touch-action: none; /* holding the button must not scroll or zoom */
    }
    .btn-arrow.held { background: var(--ui-accent); transform: scale(0.94); }
    #moon-pad-label {
      color: #e8e2ff;
      font-size: 18px;
      font-weight: 600;
      pointer-events: none;
    }

    #hud-top-right {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      gap: 12px;
    }
    .btn[aria-pressed="true"].btn-toggle { background: var(--ui-accent); }

    .btn-big {
      min-height: 68px;
      padding: 0 30px;
      font-size: 26px;
      font-weight: 700;
    }
    #btn-ground {
      position: fixed;
      left: 50%;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 92px);
      transform: translateX(-50%);
      background: var(--ui-accent);
      white-space: nowrap;
      animation: pop-in 0.35s ease-out;
    }
    #btn-ground:active { transform: translateX(-50%) scale(0.94); }
    #btn-ground[hidden] { display: none; }
    @keyframes pop-in {
      from { opacity: 0; transform: translateX(-50%) scale(0.7); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    /* ---------- Ground view (what people on Earth see) ---------- */
    #ground {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #0d1238;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0s linear 0.5s;
    }
    #ground.open { opacity: 1; visibility: visible; transition: opacity 0.5s ease; }
    #ground-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #ground-top {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .chip {
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--ui-bg);
      color: var(--ui-text);
      font-size: 20px;
      font-weight: 600;
      box-shadow: var(--ui-shadow);
    }
    #btn-replay[hidden], #ground-top[hidden] { display: none; }

    /* Countryside / City switch, just above "Watch again" */
    #scene-switch {
      position: absolute;
      left: 50%;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 80px);
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: var(--ui-bg);
      box-shadow: var(--ui-shadow);
    }
    #scene-switch button {
      min-height: 56px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--ui-text);
      font: 600 20px/1 "Fredoka", system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    #scene-switch button[aria-pressed="true"] { background: var(--ui-accent); }
    #scene-switch button:focus-visible { outline: 4px solid var(--ui-accent); outline-offset: 2px; }
    #btn-replay {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
    }
    #btn-replay:active { transform: translateX(-50%) scale(0.94); }

    @media (max-width: 560px) {
      #btn-ground { font-size: 22px; padding: 0 22px; }
      #scene-switch button { font-size: 18px; padding: 0 14px; }
      .chip { font-size: 17px; }
    }
    .btn-round { width: var(--tap); padding: 0; font-size: 24px; }

    /* Narrower screens: Reset view moves to the top-left */
    @media (max-width: 860px) {
      #hud-bottom-right {
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        right: auto;
        bottom: auto;
      }
    }
    @media (max-width: 560px) {
      #moon-pad-label { display: none; }
    }

    /* ---------- Guides: Stella the Star and Captain Kai ---------- */
    #guide-dock {
      --dock-bottom: calc(max(16px, env(safe-area-inset-bottom)) + 92px);
      position: fixed;
      z-index: 40;
      bottom: var(--dock-bottom);
      width: min(720px, calc(100vw - 32px));
      display: flex;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }
    body.ground-open #guide-dock { --dock-bottom: calc(max(16px, env(safe-area-inset-bottom)) + 160px); }
    #guide-dock[hidden] { display: none; }
    #guide-dock.side-left  { left: max(16px, env(safe-area-inset-left)); flex-direction: row; }
    #guide-dock.side-right { right: max(16px, env(safe-area-inset-right)); flex-direction: row-reverse; }
    #guide-dock > * { pointer-events: auto; }

    .guide-figure { position: relative; flex: 0 0 auto; width: 180px; height: 200px; }
    .guide-figure svg.fig { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .fig-stella { filter: drop-shadow(0 0 14px rgba(255, 210, 63, 0.85)); }
    .fig-kai { filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35)); }

    /* Idle life: Stella twinkles, Kai floats and waves */
    .stella-body { transform-origin: 60px 64px; animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(-3deg); }
      50%      { transform: scale(1.07) rotate(3deg); }
    }
    .fig-kai { animation: float 3.4s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-9px) rotate(3deg); }
    }
    .kai-arm { transform-box: view-box; transform-origin: 108px 94px; animation: wave 1.1s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: rotate(-14deg); }
      50%      { transform: rotate(16deg); }
    }

    /* Entrances and exits */
    #guide-dock.entering.side-left  .guide-figure { animation: stella-in 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
    #guide-dock.entering.side-right .guide-figure { animation: kai-in 1s cubic-bezier(0.2, 0.8, 0.25, 1) both; }
    #guide-dock.entering .bubble { animation: bubble-in 0.45s 0.2s ease-out both; }
    @keyframes stella-in {
      0%   { transform: translateX(-90px) scale(0.4) rotate(-40deg); opacity: 0; }
      70%  { transform: translateX(6px) scale(1.08) rotate(6deg); opacity: 1; }
      100% { transform: none; }
    }
    @keyframes kai-in {
      0%   { transform: translate(110px, 50px) rotate(18deg); opacity: 0; }
      60%  { transform: translate(-6px, -8px) rotate(-4deg); opacity: 1; }
      100% { transform: none; }
    }
    @keyframes bubble-in {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    #guide-dock.leaving { transition: opacity 0.25s ease, transform 0.25s ease; opacity: 0; }
    #guide-dock.leaving.side-left  { transform: translateX(-40px); }
    #guide-dock.leaving.side-right { transform: translateX(40px); }

    /* Sparkles around Stella when she arrives */
    .sparkle { position: absolute; width: 30px; height: 30px; opacity: 0; pointer-events: none; }
    .sparkle svg { width: 100%; height: 100%; }
    #guide-dock.entering .sparkle { animation: sparkle 0.9s ease-out both; }
    .sparkle.s1 { left: -6px; top: 6px; }
    .sparkle.s2 { right: -4px; top: -6px; animation-delay: 0.12s !important; }
    .sparkle.s3 { left: 76px; bottom: 6px; animation-delay: 0.24s !important; }
    @keyframes sparkle {
      0%   { transform: scale(0) rotate(0); opacity: 0; }
      40%  { transform: scale(1.2) rotate(45deg); opacity: 1; }
      100% { transform: scale(0) rotate(90deg); opacity: 0; }
    }

    /* Speech bubble */
    .bubble {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      margin-bottom: 44px;
      padding: 14px 18px 14px;
      border-radius: 26px;
      background: #fff;
      color: var(--ui-text);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .bubble::after { /* little tail pointing at the guide */
      content: "";
      position: absolute;
      bottom: 22px;
      width: 0; height: 0;
      border: 12px solid transparent;
    }
    .side-left  .bubble::after { left: -20px; border-right-color: #fff; border-right-width: 14px; }
    .side-right .bubble::after { right: -20px; border-left-color: #fff; border-left-width: 14px; }
    .bubble.pop { animation: bubble-in 0.3s ease-out; }
    .bubble-name { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a7fc4; }
    .side-left .bubble-name { color: #d99400; }
    .bubble-body { display: flex; align-items: center; gap: 12px; }
    .bubble-icon { flex: 0 0 auto; width: 76px; }
    .bubble-icon[hidden] { display: none; }
    .bubble-icon svg { width: 100%; height: auto; display: block; }
    #bubble-text { margin: 4px 0 6px; font-size: 25px; font-weight: 600; line-height: 1.25; }
    .bubble-more {
      margin: 4px 0 8px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #f3f0ff;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.35;
      color: #463a85;
    }
    .bubble-more[hidden] { display: none; }
    .bubble-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
    .bubble-actions[hidden], .bubble-actions .btn[hidden] { display: none; }
    .bubble .btn { box-shadow: none; border: 3px solid #e4defa; font-size: 19px; padding: 0 16px; }
    .bubble .btn-round { padding: 0; font-size: 22px; }
    #btn-speak.speaking { background: #ffe08a; border-color: var(--ui-accent); }
    #btn-next {
      position: relative;
      overflow: hidden;
      margin-left: auto;
      border-color: var(--ui-accent);
      background: var(--ui-accent);
      font-size: 22px;
      font-weight: 700;
    }
    #btn-next:disabled { cursor: default; background: #f1eef9; border-color: #e4defa; color: rgba(42, 31, 92, 0.45); }
    #btn-next .lock-bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--ui-accent); }
    #btn-next.locking .lock-bar { width: 100%; transition-property: width; transition-timing-function: linear; }
    #btn-next:not(:disabled) .lock-bar { display: none; }
    .bubble .btn-action { background: #fff3c4; border-color: var(--ui-accent); }
    #guide-dock.quick .bubble { padding-bottom: 14px; }

    /* ✕ hides the bubble; a small button brings the guide back */
    #btn-hide-guide {
      position: absolute;
      top: -20px;
      width: 56px;
      height: 56px;
      min-width: 0;
      padding: 0;
      border: 3px solid #e4defa;
      background: #fff;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .side-left  #btn-hide-guide { right: -14px; }
    .side-right #btn-hide-guide { left: -14px; }
    #btn-hide-guide[hidden] { display: none; }
    #btn-show-guide {
      position: fixed;
      z-index: 40;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 92px);
      border: 3px solid var(--ui-accent);
      font-size: 20px;
    }
    body.ground-open #btn-show-guide { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 160px); }
    #btn-show-guide.side-left  { left: max(16px, env(safe-area-inset-left)); }
    #btn-show-guide.side-right { right: max(16px, env(safe-area-inset-right)); }
    #btn-show-guide[hidden] { display: none; }
    #btn-show-guide.has-new { animation: nudge 1.2s ease-in-out infinite; background: #fff3c4; }
    @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* While a guide is talking, the space "See it from Earth" button lives in the bubble instead */
    body.guide-open #btn-ground { display: none; }

    /* Narrow screens: bubble docks across the bottom, the guide peeks over its corner */
    @media (max-width: 700px) {
      #guide-dock { left: 16px !important; right: 16px !important; width: auto; display: block; }
      .guide-figure { position: absolute; top: -118px; width: 120px; height: 134px; }
      .side-left .guide-figure { left: 4px; }
      .side-right .guide-figure { right: 4px; }
      .bubble { margin: 0; padding-top: 16px; }
      .bubble::after { display: none; }
      .side-left .bubble-name { padding-left: 124px; }
      .side-right .bubble-name { text-align: right; padding-right: 124px; }
      #bubble-text { font-size: 21px; }
      .bubble-more { font-size: 17px; }
      .bubble-icon { width: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stella-body, .fig-kai, .kai-arm, .sparkle, #btn-show-guide.has-new, #btn-next.ready { animation: none !important; }
      #guide-dock.entering .guide-figure, #guide-dock.entering .bubble, .bubble.pop { animation: fade-in 0.2s both !important; }
      #guide-dock.leaving { transform: none !important; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    }

    /* ---------- Lessons: chapter progress bar, task chip, fact labels ---------- */
    #progress {
      position: fixed;
      z-index: 5;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    #progress > * { pointer-events: auto; }
    #progress[hidden] { display: none; }
    #progress-dots {
      position: relative;
      display: flex;
      gap: 8px;
      margin: 0;
      padding: 6px;
      list-style: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }
    .chapter-dot {
      position: relative;
      width: 56px;
      height: 56px;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ui-text);
      font: 700 22px/1 "Fredoka", system-ui, sans-serif;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .chapter-dot:active { transform: scale(0.92); }
    .chapter-dot:focus-visible { outline: 4px solid var(--ui-accent); outline-offset: 2px; }
    .chapter-dot.current { border-color: var(--ui-accent); background: #fff3c4; transform: scale(1.08); }
    .chapter-dot.done::after {
      content: "✓";
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3fb15a;
      color: #fff;
      font-size: 14px;
      line-height: 22px;
    }
    .chapter-dot:disabled { cursor: default; opacity: 0.45; background: rgba(255, 255, 255, 0.6); }
    #progress-title {
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
    }
    #task-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--ui-bg);
      color: var(--ui-text);
      font-size: 19px;
      font-weight: 700;
      box-shadow: var(--ui-shadow);
    }
    #task-chip[hidden] { display: none; }
    #task-chip .meter { width: 140px; height: 14px; border-radius: 999px; background: #e4defa; overflow: hidden; }
    #task-chip .meter span { display: block; height: 100%; width: 0; background: var(--ui-accent); transition: width 0.2s ease; }
    #task-chip.done { background: #d9f7df; }

    #fact-labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
    .fact-label {
      position: absolute;
      left: 0; top: 0;
      max-width: 230px;
      padding: 8px 14px;
      border-radius: 18px;
      background: #fff;
      color: var(--ui-text);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      box-shadow: var(--ui-shadow);
      animation: bubble-in 0.3s ease-out;
    }
    .fact-label::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      margin-left: -10px;
      border: 10px solid transparent;
      border-bottom: 0;
      border-top-color: #fff;
    }
    .fact-label.below::after { bottom: auto; top: -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: #fff; }
    .fact-label::after { left: var(--tail-x, 50%); }

    /* Bubble extras used by lessons */
    .bubble-cheer { margin: 0 0 6px; font-size: 21px; font-weight: 700; color: #c77700; animation: bubble-in 0.3s ease-out; }
    .bubble-cheer[hidden] { display: none; }
    #btn-next.ready { animation: nudge 0.9s ease-in-out 3; }

    /* Medium screens: the chapter bar drops below the top buttons */
    @media (max-width: 1000px) {
      #progress { top: calc(max(16px, env(safe-area-inset-top)) + 70px); }
    }
    @media (max-width: 560px) {
      .chapter-dot { width: 44px; height: 44px; font-size: 18px; }
      #progress-dots { gap: 4px; }
      #progress-title { font-size: 15px; }
      #task-chip { font-size: 16px; }
      #task-chip .meter { width: 90px; }
    }

    /* ---------- Quiz (chapter 6) ---------- */
    #quiz {
      position: fixed;
      z-index: 35;
      left: 50%;
      top: calc(max(16px, env(safe-area-inset-top)) + 128px);
      transform: translateX(-50%);
      width: min(640px, calc(100vw - 32px));
      padding: 14px 16px 16px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: bubble-in 0.35s ease-out;
    }
    #quiz[hidden] { display: none; }
    .quiz-count { margin-bottom: 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a7fc4; }
    .quiz-answers { display: flex; justify-content: center; gap: 12px; }
    .quiz-answer {
      flex: 1 1 0;
      min-width: 0;
      max-width: 250px;
      min-height: 140px;
      padding: 10px;
      border: 4px solid #e4defa;
      border-radius: 22px;
      background: #fff;
      color: var(--ui-text);
      font: 700 19px/1.2 "Fredoka", system-ui, sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, opacity 0.25s ease;
    }
    .quiz-answer:active { transform: scale(0.95); }
    .quiz-answer:focus-visible { outline: 4px solid var(--ui-accent); outline-offset: 3px; }
    .quiz-answer svg { width: 100%; height: auto; display: block; }
    .quiz-answer .big-emoji { font-size: 56px; line-height: 1; }
    .quiz-answer.wrong { opacity: 0.45; animation: shake 0.4s ease; cursor: default; }
    .quiz-answer.right { border-color: #3fb15a; background: #d9f7df; animation: pop 0.4s ease; }
    .quiz-answers.solved .quiz-answer:not(.right) { opacity: 0.35; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    #confetti { position: fixed; inset: 0; z-index: 45; width: 100%; height: 100%; pointer-events: none; }

    /* Free play button (shows once free play is unlocked) */
    #btn-free-play { background: #fff3c4; border: 3px solid var(--ui-accent); }
    #btn-free-play[hidden] { display: none; }

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    /* =====================================================================
       CONFIG
       All the numbers that shape the scene live here.
       The friendly view is NOT to scale (see the "Real sizes" toggle later).
       ===================================================================== */
    const CONFIG = {
      sun:   { position: new THREE.Vector3(-20, 0, 0), radius: 5, color: 0xffd23f, glowColor: 0xffb703, glowSize: 26 },
      earth: { position: new THREE.Vector3(8, 0, 0),  radius: 2.6, spinSpeed: 0.12, tilt: 0.41 },
      moon:  { radius: 0.95, orbitRadius: 7.5, startAngle: Math.PI * 0.62 },
      orbitDots: { count: 80, size: 0.11, color: 0xb9b0ff },
      stars: { count: 1800, radius: 220 },
      shadows: { mapSize: 2048, halfSize: 10.5 },   // shadow camera box around the Earth–Moon system
      light: { sunIntensity: 2.6, ambientIntensity: 0.32 },
      camera: {
        fov: 42,
        target: new THREE.Vector3(-2.5, 0, 0),
        direction: new THREE.Vector3(0.12, 0.42, 1).normalize(), // where the camera sits, seen from the target
        fitWidth: 45,      // world units that must fit across the screen
        fitHeight: 20,
        minDistance: 18,
        maxDistance: 90,
      },
      interaction: {
        snapDeg: 10,          // closer than this to a perfect line-up → snap into place
        releaseDeg: 15,       // once snapped, the Moon lets go after this much (stops jitter)
        nearDeg: 30,          // "Almost! Keep going!" zone
        arrowSpeedDeg: 75,    // how fast ◀ ▶ move the Moon, degrees per second
        arrowNudgeDeg: 4,     // a quick tap still moves the Moon a little
        followRate: 14,       // how quickly the Moon glides to where it should be
        hitRadiusScale: 2.4,  // grab area around the Moon, bigger than the Moon for small fingers
      },
      glow: { color: 0xffe08a },
      cones: { earthLength: 16, opacity: 1 },
      redMoon: { tint: 0xe0a080, emissive: 0xb0401c, emissiveIntensity: 0.75, riseSeconds: 3 },
      reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    };

    // Moon angle convention (around Earth, in the flat orbit plane):
    //   angle = PI  → Moon is between Sun and Earth  (solar eclipse line-up)
    //   angle = 0   → Moon is behind Earth           (lunar eclipse line-up)
    const state = {
      moonAngle: CONFIG.moon.startAngle,   // where the Moon is drawn
      rawAngle: CONFIG.moon.startAngle,    // where the child is pushing it (finger / arrows)
      targetAngle: CONFIG.moon.startAngle, // rawAngle, or the exact line-up while snapped
      aligned: null,                       // null | "solar" | "lunar"
      near: null,                          // null | "solar" | "lunar"  (close, not snapped yet)
      arrowDir: 0,                         // -1, 0, +1 while an arrow is held
      dragging: false,
      glow: 0,                             // 0..1 brightness of the line-up glow
      conesOn: false,                      // teaching cones visible?
      cones: 0,                            // 0..1 cone fade
      redness: 0,                          // 0..1 how coppery-red the Moon is
    };

    /* =====================================================================
       SCENE
       Renderer, camera, camera controls, background and starfield.
       ===================================================================== */
    const canvas = document.getElementById("scene");
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    } catch (err) {
      document.querySelector("#overlay div").textContent = "😢 This browser can't show 3D.";
      document.getElementById("overlay-detail").textContent = "Try a newer browser like Chrome, Edge, Firefox or Safari.";
      throw err;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = makeSpaceGradient();

    const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, 0.1, 1000);

    const controls = new OrbitControls(camera, canvas);
    controls.target.copy(CONFIG.camera.target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.7;
    controls.minDistance = CONFIG.camera.minDistance;
    controls.maxDistance = CONFIG.camera.maxDistance;
    // Keep kids from getting lost: no flipping under the orbit plane, limited spin around.
    controls.minPolarAngle = 0.25;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minAzimuthAngle = -1.1;
    controls.maxAzimuthAngle = 1.1;

    /** Distance at which the whole Sun–Earth–Moon line fits the current screen. */
    function fitDistance() {
      const vFov = THREE.MathUtils.degToRad(CONFIG.camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const dW = CONFIG.camera.fitWidth / 2 / Math.tan(hFov / 2);
      const dH = CONFIG.camera.fitHeight / 2 / Math.tan(vFov / 2);
      return Math.max(dW, dH, CONFIG.camera.minDistance);
    }

    function homeCameraPosition() {
      return CONFIG.camera.target.clone().addScaledVector(CONFIG.camera.direction, fitDistance());
    }

    function makeSpaceGradient() {
      const c = document.createElement("canvas");
      c.width = 4; c.height = 512;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, "#0d0826");
      grad.addColorStop(0.55, "#1e1650");
      grad.addColorStop(1, "#2d1b5e");
      g.fillStyle = grad;
      g.fillRect(0, 0, 4, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeStarfield() {
      const { count, radius } = CONFIG.stars;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [new THREE.Color(0xffffff), new THREE.Color(0xfff3c4), new THREE.Color(0xcfd8ff), new THREE.Color(0xffd6f0)];
      const v = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        v.randomDirection().multiplyScalar(radius * (0.8 + Math.random() * 0.2));
        positions.set([v.x, v.y, v.z], i * 3);
        const col = palette[i % palette.length].clone().multiplyScalar(0.55 + Math.random() * 0.45);
        colors.set([col.r, col.g, col.b], i * 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 2.2, sizeAttenuation: false, vertexColors: true,
        map: makeRadialTexture(["rgba(255,255,255,1)", "rgba(255,255,255,0.6)", "rgba(255,255,255,0)"]),
        transparent: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }
    scene.add(makeStarfield());

    /** Soft round gradient, used for star points and the Sun's glow. */
    function makeRadialTexture(stops, size = 128) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach((s, i) => grad.addColorStop(i / (stops.length - 1), s));
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    /* =====================================================================
       BODIES
       Sun, Earth, Moon and the Moon's dotted orbit. Textures are drawn on
       canvases, so there are no image files to download.
       ===================================================================== */

    // Small seeded random so the Earth and Moon look the same every time.
    function seededRandom(seed) {
      return () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
    }

    function makeEarthTexture() {
      const W = 1024, H = 512;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      const rand = seededRandom(7);

      // Ocean with a gentle gradient
      const ocean = g.createLinearGradient(0, 0, 0, H);
      ocean.addColorStop(0, "#3a8dde");
      ocean.addColorStop(0.5, "#2f7fd6");
      ocean.addColorStop(1, "#3a8dde");
      g.fillStyle = ocean;
      g.fillRect(0, 0, W, H);

      // Chunky cartoon continents: clusters of overlapping round blobs.
      const continents = [
        { x: 0.17, y: 0.33, w: 0.11, h: 0.13, n: 14 }, // north-west
        { x: 0.25, y: 0.66, w: 0.05, h: 0.14, n: 9 },  // south-west
        { x: 0.51, y: 0.30, w: 0.07, h: 0.07, n: 8 },  // north-middle
        { x: 0.53, y: 0.56, w: 0.06, h: 0.14, n: 11 }, // middle
        { x: 0.70, y: 0.31, w: 0.15, h: 0.11, n: 16 }, // north-east
        { x: 0.83, y: 0.70, w: 0.05, h: 0.05, n: 6 },  // south-east island
      ];
      const drawLand = (color, grow) => {
        g.fillStyle = color;
        continents.forEach((ct) => {
          const r = seededRandom(Math.floor(ct.x * 1000));
          for (let i = 0; i < ct.n; i++) {
            const x = (ct.x + (r() - 0.5) * 2 * ct.w) * W;
            const y = (ct.y + (r() - 0.5) * 2 * ct.h) * H;
            const rad = (0.035 + r() * 0.04) * H + grow;
            g.beginPath();
            g.arc(x, y, rad, 0, Math.PI * 2);
            g.fill();
          }
        });
      };
      drawLand("#7bd389", 7); // light green shoreline
      drawLand("#3fb15a", 0); // green land

      // A few lighter patches for texture
      g.fillStyle = "rgba(255, 240, 170, 0.35)";
      for (let i = 0; i < 10; i++) {
        const ct = continents[i % continents.length];
        g.beginPath();
        g.arc((ct.x + (rand() - 0.5) * ct.w) * W, (ct.y + (rand() - 0.5) * ct.h) * H, 8 + rand() * 12, 0, Math.PI * 2);
        g.fill();
      }

      // Ice caps
      g.fillStyle = "#f4f8ff";
      g.fillRect(0, 0, W, H * 0.06);
      g.fillRect(0, H * 0.94, W, H * 0.06);
      for (let x = 0; x < W; x += 40) {
        g.beginPath(); g.arc(x, H * 0.06, 14 + rand() * 10, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(x + 20, H * 0.94, 14 + rand() * 10, 0, Math.PI * 2); g.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function makeMoonTextures() {
      const W = 512, H = 256;
      const color = document.createElement("canvas");
      const bump = document.createElement("canvas");
      color.width = bump.width = W;
      color.height = bump.height = H;
      const gc = color.getContext("2d");
      const gb = bump.getContext("2d");
      const rand = seededRandom(42);

      gc.fillStyle = "#b9b6c2";
      gc.fillRect(0, 0, W, H);
      gb.fillStyle = "#808080";
      gb.fillRect(0, 0, W, H);

      // A few big soft "seas"
      for (let i = 0; i < 6; i++) {
        gc.fillStyle = "rgba(120, 116, 135, 0.45)";
        gc.beginPath();
        gc.arc(rand() * W, H * (0.25 + rand() * 0.5), 20 + rand() * 30, 0, Math.PI * 2);
        gc.fill();
      }
      // Chunky craters: dark floor + light rim (color), dip + ridge (bump)
      for (let i = 0; i < 26; i++) {
        const x = rand() * W, y = H * (0.12 + rand() * 0.76), r = 5 + rand() * 16;
        gc.fillStyle = "#e3e1ea";
        gc.beginPath(); gc.arc(x + 1.5, y + 1.5, r * 1.15, 0, Math.PI * 2); gc.fill();
        gc.fillStyle = "#94909f";
        gc.beginPath(); gc.arc(x, y, r, 0, Math.PI * 2); gc.fill();

        gb.fillStyle = "#c8c8c8";
        gb.beginPath(); gb.arc(x, y, r * 1.2, 0, Math.PI * 2); gb.fill();
        gb.fillStyle = "#3c3c3c";
        gb.beginPath(); gb.arc(x, y, r, 0, Math.PI * 2); gb.fill();
      }

      const map = new THREE.CanvasTexture(color);
      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(bump);
      return { map, bumpMap };
    }

    // --- Sun: unlit glowing ball + additive halo sprite ---
    const sun = new THREE.Group();
    sun.position.copy(CONFIG.sun.position);
    const sunBall = new THREE.Mesh(
      new THREE.SphereGeometry(CONFIG.sun.radius, 48, 32),
      new THREE.MeshBasicMaterial({ color: CONFIG.sun.color })
    );
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeRadialTexture([
        "rgba(255, 236, 140, 0.95)",
        "rgba(255, 196, 60, 0.55)",
        "rgba(255, 150, 40, 0.18)",
        "rgba(255, 120, 40, 0)",
      ]),
      color: CONFIG.sun.glowColor,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
    }));
    sunGlow.scale.setScalar(CONFIG.sun.glowSize);
    sun.add(sunGlow, sunBall);
    scene.add(sun);

    // --- Earth: tilted group so the spin looks natural ---
    const earthSystem = new THREE.Group();      // sits at Earth's position; the Moon orbits this
    earthSystem.position.copy(CONFIG.earth.position);
    scene.add(earthSystem);

    const earthTilt = new THREE.Group();
    earthTilt.rotation.z = CONFIG.earth.tilt;
    earthSystem.add(earthTilt);

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(CONFIG.earth.radius, 64, 48),
      new THREE.MeshStandardMaterial({ map: makeEarthTexture(), roughness: 0.75, metalness: 0 })
    );
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthTilt.add(earth);

    // --- Moon ---
    const moonTex = makeMoonTextures();
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(CONFIG.moon.radius, 48, 32),
      new THREE.MeshStandardMaterial({
        map: moonTex.map, bumpMap: moonTex.bumpMap, bumpScale: 3, roughness: 1, metalness: 0,
        emissive: CONFIG.redMoon.emissive, emissiveMap: moonTex.map, emissiveIntensity: 0, // red glow, off for now
      })
    );
    moon.castShadow = true;
    moon.receiveShadow = true;
    earthSystem.add(moon);

    // Invisible, larger sphere that makes the Moon easy to grab with a finger.
    const moonHit = new THREE.Mesh(
      new THREE.SphereGeometry(CONFIG.moon.radius * CONFIG.interaction.hitRadiusScale, 16, 12),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    moon.add(moonHit);

    function placeMoon(angle) {
      moon.position.set(
        Math.cos(angle) * CONFIG.moon.orbitRadius,
        0,
        -Math.sin(angle) * CONFIG.moon.orbitRadius
      );
      moon.rotation.y = angle; // same face toward Earth, like the real Moon
    }
    placeMoon(state.moonAngle);

    // --- Dotted orbit: chunky dots read better than a 1-pixel line ---
    const orbitDots = new THREE.InstancedMesh(
      new THREE.SphereGeometry(CONFIG.orbitDots.size, 10, 8),
      new THREE.MeshBasicMaterial({ color: CONFIG.orbitDots.color, transparent: true, opacity: 0.7 }),
      CONFIG.orbitDots.count
    );
    {
      const m = new THREE.Matrix4();
      for (let i = 0; i < CONFIG.orbitDots.count; i++) {
        const a = (i / CONFIG.orbitDots.count) * Math.PI * 2;
        m.makeTranslation(Math.cos(a) * CONFIG.moon.orbitRadius, 0, Math.sin(a) * CONFIG.moon.orbitRadius);
        orbitDots.setMatrixAt(i, m);
      }
    }
    earthSystem.add(orbitDots);

    /* =====================================================================
       LIGHT & SHADOWS
       One directional light shining from the Sun toward Earth. Its shadow
       camera is a tight box around the Earth–Moon system, so the shadows
       stay crisp. Eclipses come from these real shadows.
       ===================================================================== */
    const sunLight = new THREE.DirectionalLight(0xfff4e0, CONFIG.light.sunIntensity);
    sunLight.position.copy(CONFIG.sun.position);
    sunLight.target = earthSystem;
    sunLight.castShadow = true;
    {
      const s = CONFIG.shadows.halfSize;
      const cam = sunLight.shadow.camera;
      cam.left = -s; cam.right = s; cam.top = s; cam.bottom = -s;
      const d = CONFIG.sun.position.distanceTo(CONFIG.earth.position);
      cam.near = d - CONFIG.moon.orbitRadius - 2;
      cam.far = d + CONFIG.moon.orbitRadius + 2;
      sunLight.shadow.mapSize.set(CONFIG.shadows.mapSize, CONFIG.shadows.mapSize);
      sunLight.shadow.bias = -0.0004;
      sunLight.shadow.normalBias = 0.02;
      sunLight.shadow.radius = 3;
    }
    scene.add(sunLight);

    // Soft fill so the night sides are dim, not pitch black.
    scene.add(new THREE.HemisphereLight(0xb8c4ff, 0x2a1f5c, CONFIG.light.ambientIntensity));

    // Line-up glow: a soft beam along Sun → Earth → Moon that lights up on a snap.
    // Everything lies on the x axis, so the beam is a cylinder turned to point along x.
    const alignGlow = new THREE.Group();
    const glowLayers = [
      { radius: 0.07, opacity: 0.6 },  // thin core
      { radius: 0.28, opacity: 0.16 }, // soft halo
    ].map(({ radius, opacity }) => {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, 1, 20, 1, true),
        new THREE.MeshBasicMaterial({
          color: CONFIG.glow.color, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false,
        })
      );
      mesh.rotation.z = Math.PI / 2;
      mesh.userData.maxOpacity = opacity;
      alignGlow.add(mesh);
      return mesh;
    });
    alignGlow.visible = false;
    scene.add(alignGlow);

    // --- Shadow cones (teaching aid) ---
    // Dark see-through cones pointing away from the Sun, with a light rim so they
    // show up against dark space. Hidden until a lesson (or the 🔦 button) turns them on.
    function makeConeMaterial(height) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uOpacity: { value: 0 },
          uHeight: { value: height },
          uColor: { value: new THREE.Color(0x0b0720) },
          uRim: { value: new THREE.Color(0xa99bff) },
        },
        vertexShader: `
          uniform float uHeight;
          varying vec3 vNormal;
          varying vec3 vView;
          varying float vAlong;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vView = normalize(-mv.xyz);
            vAlong = position.y / uHeight + 0.5;   // 0 at the body, 1 at the tip
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform float uOpacity;
          uniform vec3 uColor;
          uniform vec3 uRim;
          varying vec3 vNormal;
          varying vec3 vView;
          varying float vAlong;
          void main() {
            float rim = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.0);
            float fade = 1.0 - 0.6 * smoothstep(0.5, 1.0, vAlong);
            vec3 col = mix(uColor, uRim, rim * 0.75);
            gl_FragColor = vec4(col, (0.42 + 0.4 * rim) * fade * uOpacity);
          }`,
      });
    }
    function makeShadowCone(radius, length) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, length, 48, 1, true), makeConeMaterial(length));
      cone.rotation.z = -Math.PI / 2; // tip points along +x, away from the Sun
      cone.userData.length = length;
      cone.visible = false;
      cone.renderOrder = 2;
      earthSystem.add(cone);
      return cone;
    }
    const earthCone = makeShadowCone(CONFIG.earth.radius, CONFIG.cones.earthLength);
    earthCone.position.x = CONFIG.cones.earthLength / 2;
    // The Moon's cone just reaches Earth when the Moon is in the middle (like a total solar eclipse).
    const moonCone = makeShadowCone(CONFIG.moon.radius, CONFIG.moon.orbitRadius - CONFIG.earth.radius + 0.4);

    function setShadowCones(on) {
      state.conesOn = Boolean(on);
      emit("cones", { on: state.conesOn });
    }

    // --- Red Moon during a lunar eclipse ---
    // How deep the Moon sits inside Earth's (straight, sun-parallel) shadow: 0 = outside, 1 = fully in.
    function moonShadowDepth() {
      const a = state.moonAngle;
      const along = Math.cos(a) * CONFIG.moon.orbitRadius;
      if (along <= 0) return 0; // Moon is on the Sun's side of Earth
      const lateral = Math.abs(Math.sin(a)) * CONFIG.moon.orbitRadius;
      return THREE.MathUtils.clamp(
        (CONFIG.earth.radius + CONFIG.moon.radius - lateral) / (2 * CONFIG.moon.radius), 0, 1);
    }
    const moonWhite = new THREE.Color(0xffffff);
    const moonTint = new THREE.Color(CONFIG.redMoon.tint);
    let redMoonAnnounced = false;

    /** Called every frame: cone fades and the slow copper-red change. */
    function updateEclipseEffects(dt) {
      // Cones
      state.cones += ((state.conesOn ? 1 : 0) - state.cones) * Math.min(1, dt * 5);
      const coneOpacity = state.cones * CONFIG.cones.opacity;
      [earthCone, moonCone].forEach((c) => {
        c.visible = coneOpacity > 0.01;
        c.material.uniforms.uOpacity.value = coneOpacity;
      });
      moonCone.position.set(moon.position.x + moonCone.userData.length / 2, 0, moon.position.z);

      // Red Moon: turns red slowly (about riseSeconds), comes back a bit faster.
      const want = Math.pow(moonShadowDepth(), 1.5);
      const rate = want > state.redness ? 1 / CONFIG.redMoon.riseSeconds : 1.5;
      state.redness += THREE.MathUtils.clamp(want - state.redness, -rate * dt, rate * dt);
      if (CONFIG.reducedMotion) state.redness = want;
      moon.material.color.copy(moonWhite).lerp(moonTint, state.redness);
      moon.material.emissiveIntensity = CONFIG.redMoon.emissiveIntensity * state.redness;

      if (!redMoonAnnounced && state.redness > 0.9) { redMoonAnnounced = true; emit("redmoon", { on: true }); }
      if (redMoonAnnounced && state.redness < 0.2) { redMoonAnnounced = false; emit("redmoon", { on: false }); }
    }

    // --- Light rays (teaching aid): straight beams from the Sun; the ones that hit Earth stop there ---
    const lightRays = new THREE.Group();
    {
      const startX = CONFIG.sun.position.x + CONFIG.sun.radius;
      const R = CONFIG.earth.radius, ex = CONFIG.earth.position.x;
      [[0, 0], [1.5, 0.6], [-1.2, 1.8], [0.4, -1.9], [0, 3.6], [-2.6, -3.2], [2.4, -4.6], [-0.6, 5.2]].forEach(([y, z]) => {
        const d = Math.hypot(y, z);
        const endX = d < R ? ex - Math.sqrt(R * R - d * d) : ex + CONFIG.moon.orbitRadius + 4;
        const len = endX - startX;
        const ray = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.06, len, 8, 1, true),
          new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        ray.rotation.z = Math.PI / 2;
        ray.position.set(startX + len / 2, y, z);
        lightRays.add(ray);
      });
    }
    lightRays.visible = false;
    scene.add(lightRays);
    let raysOn = false, raysFade = 0;
    function setLightRays(on) { raysOn = Boolean(on); }
    function updateLightRays(dt) {
      raysFade += ((raysOn ? 1 : 0) - raysFade) * Math.min(1, dt * 4);
      lightRays.visible = raysFade > 0.01;
      if (!lightRays.visible) return;
      const shimmer = CONFIG.reducedMotion ? 1 : 0.85 + 0.15 * Math.sin(clock.elapsedTime * 4);
      lightRays.children.forEach((r) => { r.material.opacity = 0.55 * raysFade * shimmer; });
    }

    /** Stretch the beam from the Sun's edge to the far end of the line-up. */
    function shapeAlignGlow(type) {
      const startX = CONFIG.sun.position.x + CONFIG.sun.radius;
      const endX = type === "lunar"
        ? CONFIG.earth.position.x + CONFIG.moon.orbitRadius   // through Earth, out to the Moon
        : CONFIG.earth.position.x;                            // through the Moon, into Earth
      const len = endX - startX;
      glowLayers.forEach((m) => { m.scale.y = len; m.position.x = startX + len / 2; });
    }

    /* =====================================================================
       INTERACTION
       The child moves the Moon by dragging it (mouse or touch) or holding
       the ◀ ▶ buttons / arrow keys. The Moon stays on its orbit. Close to a
       perfect line-up it snaps into place, dings and the line-up glows.
       Other parts of the app listen with events.addEventListener(...):
         "alignment" → detail.type is "solar", "lunar" or null
         "near"      → detail.type is "solar", "lunar" or null
         "dragstart" / "dragend"
       ===================================================================== */
    const TAU = Math.PI * 2;
    const LINEUPS = { solar: Math.PI, lunar: 0 };
    const deg = THREE.MathUtils.degToRad;
    const wrapAngle = (a) => ((a % TAU) + TAU) % TAU;
    /** Signed shortest turn from b to a, in (-PI, PI]. */
    const angleDiff = (a, b) => { const d = wrapAngle(a - b); return d > Math.PI ? d - TAU : d; };

    const events = new EventTarget();
    const emit = (name, detail = {}) => events.dispatchEvent(new CustomEvent(name, { detail }));

    // Later steps switch this off (e.g. while "real sizes" is on).
    const interactionRules = { snapEnabled: true, moonEnabled: true };

    function nearestLineup(angle) {
      const solarOff = Math.abs(angleDiff(angle, LINEUPS.solar));
      const lunarOff = Math.abs(angleDiff(angle, LINEUPS.lunar));
      return solarOff < lunarOff ? { type: "solar", off: solarOff } : { type: "lunar", off: lunarOff };
    }

    function updateAlignment() {
      const cfg = CONFIG.interaction;
      const nearest = nearestLineup(state.rawAngle);

      let aligned = state.aligned;
      if (aligned && (aligned !== nearest.type || nearest.off > deg(cfg.releaseDeg))) aligned = null;
      if (!aligned && interactionRules.snapEnabled && nearest.off < deg(cfg.snapDeg)) aligned = nearest.type;
      if (!interactionRules.snapEnabled) aligned = null;

      if (aligned !== state.aligned) {
        state.aligned = aligned;
        if (aligned) { shapeAlignGlow(aligned); Sound.ding(); }
        emit("alignment", { type: aligned });
      }

      const near = !aligned && nearest.off < deg(cfg.nearDeg) ? nearest.type : null;
      if (near !== state.near) {
        state.near = near;
        emit("near", { type: near });
      }

      state.targetAngle = aligned ? LINEUPS[aligned] : state.rawAngle;
    }

    function setRawAngle(angle) {
      const before = state.rawAngle;
      state.rawAngle = wrapAngle(angle);
      updateAlignment();
      const delta = angleDiff(state.rawAngle, before);
      if (delta) emit("moonpush", { delta });   // lessons count how far the child moved the Moon
    }

    // --- Dragging: find where the pointer meets the flat orbit plane ---
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const orbitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CONFIG.earth.position.y);
    const planeHit = new THREE.Vector3();
    let dragPointerId = null;

    function aimRay(e) {
      const r = canvas.getBoundingClientRect();
      pointerNdc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointerNdc, camera);
    }
    function pointerIsOnMoon(e) {
      aimRay(e);
      return raycaster.intersectObject(moonHit, false).length > 0;
    }
    function orbitAngleUnderPointer(e) {
      aimRay(e);
      if (!raycaster.ray.intersectPlane(orbitPlane, planeHit)) return null;
      const x = planeHit.x - CONFIG.earth.position.x;
      const z = planeHit.z - CONFIG.earth.position.z;
      if (x * x + z * z < 0.25) return null; // right on Earth's centre: direction is unclear
      return Math.atan2(-z, x);              // matches placeMoon(): z = -sin(angle)
    }

    // Capture phase on window runs before OrbitControls' own listener on the canvas,
    // so grabbing the Moon never also spins the camera.
    window.addEventListener("pointerdown", (e) => {
      if (e.target !== canvas) return;
      if (dragPointerId !== null) { e.stopPropagation(); return; } // ignore a 2nd finger mid-drag
      if (!e.isPrimary || !interactionRules.moonEnabled || !pointerIsOnMoon(e)) return;
      e.stopPropagation();
      e.preventDefault();
      dragPointerId = e.pointerId;
      state.dragging = true;
      canvas.style.cursor = "grabbing";
      emit("dragstart");
    }, { capture: true });

    window.addEventListener("pointermove", (e) => {
      if (e.pointerId === dragPointerId) {
        const a = orbitAngleUnderPointer(e);
        if (a !== null) setRawAngle(a);
      } else if (dragPointerId === null && e.pointerType === "mouse" && e.target === canvas) {
        canvas.style.cursor = interactionRules.moonEnabled && pointerIsOnMoon(e) ? "grab" : "";
      }
    });

    function endDrag(e) {
      if (e.pointerId !== dragPointerId) return;
      dragPointerId = null;
      state.dragging = false;
      canvas.style.cursor = "";
      emit("dragend");
    }
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    // --- Tapping a body (Sun, Earth or Moon) without dragging → "bodytap" event ---
    let tapStart = null;
    window.addEventListener("pointerdown", (e) => {
      tapStart = e.target === canvas && e.isPrimary ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
    }, { capture: true });
    window.addEventListener("pointerup", (e) => {
      if (!tapStart || !e.isPrimary) return;
      const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
      const quick = performance.now() - tapStart.t < 700;
      tapStart = null;
      if (moved > 10 || !quick) return;
      aimRay(e);
      const hits = raycaster.intersectObjects([moonHit, earth, sunBall], false);
      if (!hits.length) return;
      const o = hits[0].object;
      emit("bodytap", { body: o === sunBall ? "sun" : o === earth ? "earth" : "moon" });
    });

    // --- ◀ ▶ buttons: tap to nudge, hold to keep moving ---
    function bindArrow(button, dir) {
      const release = () => {
        button.classList.remove("held");
        if (state.arrowDir === dir) state.arrowDir = 0;
      };
      button.addEventListener("pointerdown", (e) => {
        if (!interactionRules.moonEnabled) return;
        e.preventDefault();
        try { button.setPointerCapture(e.pointerId); } catch { /* not a live pointer */ }
        button.classList.add("held");
        state.arrowDir = dir;
        setRawAngle(state.rawAngle + dir * deg(CONFIG.interaction.arrowNudgeDeg));
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
      // Keyboard users: Enter/Space on the focused button gives one nudge.
      button.addEventListener("click", (e) => {
        if (e.detail === 0 && interactionRules.moonEnabled) {
          setRawAngle(state.rawAngle + dir * deg(CONFIG.interaction.arrowNudgeDeg * 2));
        }
      });
    }
    // ▶ moves the Moon the way the real Moon travels (counter-clockwise seen from above).
    bindArrow(document.getElementById("btn-moon-back"), -1);
    bindArrow(document.getElementById("btn-moon-forward"), 1);

    // Arrow keys on the keyboard work too.
    window.addEventListener("keydown", (e) => {
      if (!interactionRules.moonEnabled) return;
      const dir = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
      if (!dir) return;
      e.preventDefault();
      if (!e.repeat) setRawAngle(state.rawAngle + dir * deg(CONFIG.interaction.arrowNudgeDeg)); // a quick press still moves
      state.arrowDir = dir;
    });
    window.addEventListener("keyup", (e) => {
      if ((e.key === "ArrowLeft" && state.arrowDir === -1) || (e.key === "ArrowRight" && state.arrowDir === 1)) {
        state.arrowDir = 0;
      }
    });
    window.addEventListener("blur", () => { state.arrowDir = 0; });

    /** Called every frame: arrows push the Moon, and the drawn Moon glides to its target. */
    function updateMoon(dt) {
      if (state.arrowDir) {
        setRawAngle(state.rawAngle + state.arrowDir * deg(CONFIG.interaction.arrowSpeedDeg) * dt);
      }
      const diff = angleDiff(state.targetAngle, state.moonAngle);
      if (Math.abs(diff) > 1e-4) {
        const k = CONFIG.reducedMotion ? 1 : 1 - Math.exp(-CONFIG.interaction.followRate * dt);
        state.moonAngle = wrapAngle(state.moonAngle + diff * k);
        placeMoon(state.moonAngle);
      }

      // Fade the line-up glow in and out, with a gentle pulse while it's on.
      const want = state.aligned ? 1 : 0;
      state.glow += (want - state.glow) * Math.min(1, dt * (want ? 4 : 6));
      alignGlow.visible = state.glow > 0.01;
      if (alignGlow.visible) {
        const pulse = CONFIG.reducedMotion ? 1 : 0.8 + 0.2 * Math.sin(clock.elapsedTime * 3);
        glowLayers.forEach((m) => { m.material.opacity = m.userData.maxOpacity * state.glow * pulse; });
      }
    }

    /* =====================================================================
       GUIDES
       Stella the Star (light things, docks left) and Captain Kai the
       Astronaut (being-there things, docks right). One talks at a time, one
       short sentence per bubble, with Next ➜, Explore more! 🔭 and 🔊.

       Guides.say(lines, { tag })  → Promise<true if finished, false if interrupted>
       Guides.enqueue(lines)       → add to what's being said (or start)
       Guides.quick(guide, text)   → short bubble that disappears by itself
       Guides.hide()               → send the guide away
       Guides.allowNext()          → show Next on a line that had next: false

       A line looks like:
         { guide: "stella" | "kai", text, more, icon: "glasses",
           lockSeconds: 2,            // Next can't be pressed before this
           next: false,               // hide Next until Guides.allowNext()
           actions: [{ label, onClick }] }
       ===================================================================== */
    const GUIDE_INFO = {
      stella: { name: "Stella the Star", side: "left",  voice: { pitch: 1.6,  rate: 1.05 } },
      kai:    { name: "Captain Kai",     side: "right", voice: { pitch: 1.15, rate: 0.92 } },
    };
    const ICONS = {
      glasses: `<svg viewBox="0 0 220 100" aria-hidden="true"><path d="M14 34 L2 22" stroke="#ff8fab" stroke-width="8" stroke-linecap="round"/><path d="M206 34 L218 22" stroke="#ff8fab" stroke-width="8" stroke-linecap="round"/><rect x="8" y="26" width="204" height="66" rx="22" fill="#ff8fab"/><path d="M98 60 Q110 46 122 60" stroke="#e5678d" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="58" cy="58" rx="38" ry="24" fill="#1d1a33"/><ellipse cx="162" cy="58" rx="38" ry="24" fill="#1d1a33"/><ellipse cx="46" cy="50" rx="10" ry="5" fill="#fff" opacity="0.35"/><ellipse cx="150" cy="50" rx="10" ry="5" fill="#fff" opacity="0.35"/></svg>`,
    };

    // --- Read-aloud (speechSynthesis). Quietly does nothing where it isn't available. ---
    const Speech = {
      supported: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
      pickVoice() {
        try {
          const voices = window.speechSynthesis.getVoices();
          const en = voices.filter((v) => /^en[-_]/i.test(v.lang) || v.lang === "en");
          return en.find((v) => /natural|samantha|google us english|jenny|aria|karen|daniel/i.test(v.name))
            || en.find((v) => /en[-_]US/i.test(v.lang)) || en[0] || null;
        } catch { return null; }
      },
      speak(text, guide, onEnd) {
        if (!this.supported) return false;
        try {
          window.speechSynthesis.cancel();
          const clean = text.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}➜]/gu, "").trim();
          const u = new SpeechSynthesisUtterance(clean);
          const v = this.pickVoice();
          if (v) u.voice = v;
          u.lang = v ? v.lang : "en-US";
          u.pitch = GUIDE_INFO[guide].voice.pitch;
          u.rate = GUIDE_INFO[guide].voice.rate;
          u.onend = u.onerror = () => onEnd && onEnd();
          window.speechSynthesis.speak(u);
          return true;
        } catch { return false; }
      },
      stop() {
        if (!this.supported) return;
        try { window.speechSynthesis.cancel(); } catch { /* ignore */ }
      },
    };
    if (Speech.supported) {
      try { window.speechSynthesis.getVoices(); } catch { /* voices load later in some browsers */ }
    }

    const Guides = (() => {
      const $ = (id) => document.getElementById(id);
      const dock = $("guide-dock"), bubble = $("bubble");
      const figStella = dock.querySelector(".fig-stella"), figKai = dock.querySelector(".fig-kai");
      const nameEl = $("bubble-name"), textEl = $("bubble-text"), moreEl = $("bubble-more");
      const iconEl = $("bubble-icon"), actionsEl = $("bubble-actions"), extraEl = $("bubble-extra");
      const speakBtn = $("btn-speak"), moreBtn = $("btn-more"), nextBtn = $("btn-next");
      const hideBtn = $("btn-hide-guide"), showBtn = $("btn-show-guide");
      let minimized = false;   // bubble tucked away; the talk waits until the child brings it back
      const cheerEl = $("bubble-cheer");
      let cheerTimer = null;

      let seq = null;          // { lines, index, resolve, tag }
      let shownGuide = null;   // guide currently on screen
      let animToken = 0;       // cancels stale enter/leave timers
      let lockTimer = null, quickTimer = null;
      let speaking = false;

      const currentLine = () => (seq ? seq.lines[seq.index] : null);

      function setSpeaking(on) {
        speaking = on;
        speakBtn.classList.toggle("speaking", on);
        speakBtn.setAttribute("aria-pressed", String(on));
      }
      function stopSpeech() { Speech.stop(); setSpeaking(false); }

      /** Bring a guide on screen (swapping out the other one), then run `then`. */
      function showGuide(guide, then) {
        const token = ++animToken;
        if (shownGuide === guide && !dock.hidden && !dock.classList.contains("leaving")) { then(); return; }
        const enter = () => {
          if (token !== animToken) return;
          dock.hidden = false;
          dock.classList.remove("leaving", "entering", "side-left", "side-right");
          dock.classList.add(GUIDE_INFO[guide].side === "left" ? "side-left" : "side-right");
          figStella.style.display = guide === "stella" ? "" : "none";
          figKai.style.display = guide === "kai" ? "" : "none";
          void dock.offsetWidth;          // restart the entrance animation
          dock.classList.add("entering");
          shownGuide = guide;
          document.body.classList.add("guide-open");
          Sound.whoosh();
          emit("guideenter", { guide });
          then();
        };
        if (!dock.hidden && shownGuide) {
          dock.classList.add("leaving");
          setTimeout(enter, CONFIG.reducedMotion ? 0 : 260);
        } else {
          enter();
        }
      }

      function hideDock() {
        const token = ++animToken;
        clearTimeout(quickTimer);
        stopSpeech();
        if (dock.hidden) return;
        dock.classList.add("leaving");
        document.body.classList.remove("guide-open");
        setTimeout(() => {
          if (token !== animToken) return;
          dock.hidden = true;
          dock.classList.remove("leaving", "entering", "quick");
          shownGuide = null;
        }, CONFIG.reducedMotion ? 0 : 280);
      }

      function renderLine(line, quick = false) {
        clearTimeout(lockTimer);
        clearTimeout(cheerTimer);
        cheerEl.hidden = true;
        nextBtn.classList.remove("ready");
        stopSpeech();
        dock.classList.toggle("quick", quick);
        nameEl.textContent = GUIDE_INFO[line.guide].name;
        textEl.textContent = line.text;
        moreEl.textContent = line.more || "";
        moreEl.hidden = true;
        moreBtn.hidden = quick || !line.more;
        moreBtn.textContent = "Explore more! 🔭";
        moreBtn.setAttribute("aria-expanded", "false");
        iconEl.innerHTML = line.icon ? ICONS[line.icon] || "" : "";
        iconEl.hidden = !line.icon;
        extraEl.replaceChildren(...(line.actions || []).map((a) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "btn btn-action";
          b.textContent = a.label;
          b.addEventListener("click", a.onClick);
          return b;
        }));
        actionsEl.hidden = quick;
        speakBtn.hidden = !Speech.supported;
        // The safety talk can't be tucked away.
        hideBtn.hidden = Boolean(seq && seq.tag === "safety" && !quick);
        nextBtn.hidden = line.next === false;

        const lock = line.lockSeconds || 0;
        const bar = nextBtn.querySelector(".lock-bar");
        nextBtn.classList.remove("locking");
        bar.style.transitionDuration = `${lock}s`;
        nextBtn.disabled = lock > 0;
        if (lock > 0) {
          void nextBtn.offsetWidth;
          nextBtn.classList.add("locking");
          lockTimer = setTimeout(() => { nextBtn.disabled = false; }, lock * 1000);
        }
        bubble.classList.remove("pop");
        void bubble.offsetWidth;
        bubble.classList.add("pop");
        emit("guideline", { guide: line.guide, text: line.text, tag: seq && seq.tag });
      }

      function showCurrent() {
        const line = currentLine();
        if (!line) return;
        if (minimized) { updateShowButton(true); return; }
        showGuide(line.guide, () => { renderLine(line); armAutoHide(); });
      }

      // Brief bubbles (free play) slip away by themselves unless the child touches them.
      let autoTimer = null;
      function armAutoHide() {
        clearTimeout(autoTimer);
        if (!seq || !seq.autoHideMs || seq.touched) return;
        const s = seq;
        autoTimer = setTimeout(() => { if (seq === s && !s.touched) { finish(false); hideDock(); } }, s.autoHideMs);
      }
      dock.addEventListener("pointerdown", () => {
        if (seq) seq.touched = true;
        clearTimeout(autoTimer);
      });

      function updateShowButton(hasNew = false) {
        const line = currentLine();
        if (!minimized || !line) { showBtn.hidden = true; showBtn.classList.remove("has-new"); return; }
        const info = GUIDE_INFO[line.guide];
        showBtn.textContent = line.guide === "stella" ? "💬 Stella" : "💬 Kai";
        showBtn.setAttribute("aria-label", `Show ${info.name} again`);
        showBtn.classList.toggle("side-left", info.side === "left");
        showBtn.classList.toggle("side-right", info.side === "right");
        if (hasNew) showBtn.classList.add("has-new");
        showBtn.hidden = false;
      }
      function minimize() {
        if (!seq) { hideDock(); return; }   // a quick bubble just goes away
        if (seq.tag === "safety") return;
        minimized = true;
        hideDock();
        updateShowButton();
        emit("guideminimized", { tag: seq.tag });
      }
      function restore() {
        minimized = false;
        updateShowButton();
        showCurrent();
      }
      hideBtn.addEventListener("click", minimize);
      showBtn.addEventListener("click", restore);

      function finish(result) {
        const s = seq;
        seq = null;
        clearTimeout(autoTimer);
        minimized = false;
        updateShowButton();
        if (s) s.resolve(result);
        emit("guidedone", { tag: s && s.tag, finished: result });
      }

      function next() {
        if (!seq || nextBtn.disabled) return;
        stopSpeech();
        if (seq.index < seq.lines.length - 1) {
          seq.index++;
          showCurrent();
        } else {
          finish(true);
          hideDock();
        }
      }

      nextBtn.addEventListener("click", next);
      moreBtn.addEventListener("click", () => {
        const open = moreEl.hidden;
        moreEl.hidden = !open;
        moreBtn.textContent = open ? "Show less" : "Explore more! 🔭";
        moreBtn.setAttribute("aria-expanded", String(open));
      });
      speakBtn.addEventListener("click", () => {
        if (speaking) { stopSpeech(); return; }
        const line = currentLine() || { guide: shownGuide || "kai", text: textEl.textContent };
        const text = moreEl.hidden ? textEl.textContent : `${textEl.textContent} ${moreEl.textContent}`;
        if (Speech.speak(text, line.guide, () => setSpeaking(false))) setSpeaking(true);
      });

      return {
        say(lines, { tag = null, autoHideMs = 0 } = {}) {
          clearTimeout(quickTimer);
          if (seq) finish(false);
          minimized = false; // something new to say brings the guide back
          return new Promise((resolve) => {
            seq = { lines: [...lines], index: 0, resolve, tag, autoHideMs, touched: false };
            showCurrent();
          });
        },
        enqueue(lines, opts = {}) {
          if (!seq) return this.say(lines, opts);
          seq.lines.push(...lines);
          if (opts.tag) seq.tag = opts.tag;
          if (minimized) updateShowButton(true); // let the child know there's more
          return Promise.resolve(true);
        },
        quick(guide, text, ms = 2200) {
          if (seq) return; // never interrupt a real explanation
          clearTimeout(quickTimer);
          showGuide(guide, () => renderLine({ guide, text }, true));
          quickTimer = setTimeout(hideDock, ms);
        },
        hide() {
          if (seq) finish(false);
          hideDock();
        },
        allowNext() {
          if (!nextBtn.hidden) return;
          nextBtn.hidden = false;
          nextBtn.classList.remove("ready");
          void nextBtn.offsetWidth;
          nextBtn.classList.add("ready");
        },
        /** A short extra line in the open bubble, e.g. "Almost! Keep going!" */
        cheer(text, ms = 2200) {
          if (dock.hidden || minimized) return;
          clearTimeout(cheerTimer);
          cheerEl.textContent = text;
          cheerEl.hidden = false;
          cheerEl.style.animation = "none";
          void cheerEl.offsetWidth;
          cheerEl.style.animation = "";
          if (ms) cheerTimer = setTimeout(() => { cheerEl.hidden = true; }, ms);
        },
        restore,
        get minimized() { return minimized; },
        get busy() { return Boolean(seq); },
        get tag() { return seq ? seq.tag : null; },
      };
    })();

      },
      // Not a lesson: the place where the child explores freely once the quiz is done.
